<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的翼識界</title>
<script>
// 主題在畫面出來前就套上，避免閃一下淺色。沒選過就跟系統設定。
(function () {
  var theme = null;
  try { theme = localStorage.getItem('tbtf-game-theme'); } catch (e) {}
  if (theme !== 'dark' && theme !== 'light') theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
})();
</script>
<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --ink: #24211d; --muted: #77706a; --line: #e2ddd6;
    --accent: #3c5a99; --accent-soft: #e6ecf7; --good: #2f7d4f; --bad: #b03a2e; --warn: #a86b12;
    --rare: #7a4bb0; --elite: #b0412e; --energy: #2a8a8a;
    --on-accent: #fff; --input-bg: #fff; --danger-line: #e7c2bd; --faint: #c9c3bb; --energy-track: #e4eeee;
    --tag-rare-bg: #efe6f8; --tag-elite-bg: #f8e6e2; --tag-good-bg: #e3f2e8; --tag-legend-bg: #fbeed6;
    --chip: #efece7; --chip-hover: #f4d9d5; --worn-line: #9cc9ad; --worn-bg: #f6fbf8;
    --backdrop: rgba(30, 26, 22, .45); --shadow: rgba(0, 0, 0, .25);
    --log-normal: var(--ink); --log-skill: #14807a; --log-heal: #2f9e5b; --log-dot: #f56262; --log-miss: #aaa49d; --result: #f6f4f0; --result-win: #eef7f1; --result-lose: #fbefed;
    --toast-bg: #2a2622; --toast-ink: #fff;
    color-scheme: light;
  }
  /* 深色模式：頁首按鈕切換，選擇存在 localStorage（tbtf-game-theme），和遊戲存檔分開 */
  :root[data-theme="dark"] {
    --bg: #1a1917; --panel: #24221f; --ink: #e8e3dc; --muted: #a09890; --line: #3a3632;
    --accent: #86a4e6; --accent-soft: #2a3347; --good: #6cc391; --bad: #e57d70; --warn: #dba65a;
    --rare: #b993e8; --elite: #e88a76; --energy: #4fbaba;
    --on-accent: #131620; --input-bg: #1e1c1a; --danger-line: #6a3a34; --faint: #57514b; --energy-track: #2c3636;
    --tag-rare-bg: #352a45; --tag-elite-bg: #452b26; --tag-good-bg: #23392c; --tag-legend-bg: #42361f;
    --chip: #34312d; --chip-hover: #4a2f2b; --worn-line: #3f6b51; --worn-bg: #1f2a23;
    --backdrop: rgba(0, 0, 0, .6); --shadow: rgba(0, 0, 0, .6);
    --log-normal: var(--ink); --log-skill: #4fd1c5; --log-heal: #62cf8c; --log-dot: #f56262; --log-miss: #7f7a74; --result: #2b2926; --result-win: #1f3327; --result-lose: #3a2422;
    --toast-bg: #e8e3dc; --toast-ink: #1a1917;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 system-ui, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 5px 12px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  button.danger { color: var(--bad); border-color: var(--danger-line); }
  button.danger.active, button.toggle.active { background: var(--bad); color: var(--on-accent); border-color: var(--bad); }
  button.small { padding: 2px 8px; font-size: 12px; }
  select, input { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--input-bg); color: var(--ink); }
  h2 { font-size: 16px; margin: 0 0 10px; }
  h3 { font-size: 14px; margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); margin-left: 4px; vertical-align: 1px; }
  .tag.rare { background: var(--tag-rare-bg); color: var(--rare); }
  .tag.elite { background: var(--tag-elite-bg); color: var(--elite); }
  .tag.equipped { background: var(--tag-good-bg); color: var(--good); }
  .tag.legend { background: var(--tag-legend-bg); color: var(--warn); }

  header { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 18px; margin: 0; }
  nav { display: flex; gap: 4px; margin-left: 12px; }
  nav button { border: none; background: transparent; padding: 6px 14px; border-radius: 6px; }
  nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .energy { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .energy .dice { white-space: nowrap; margin-left: 4px; }
  .header-actions { display: flex; gap: 6px; }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; padding: 16px 20px; max-width: 1400px; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .stack > * + * { margin-top: 8px; }

  .hero dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; }
  .hero dt { color: var(--muted); }
  .hero dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .hero ul { margin: 4px 0 0; padding-left: 18px; }

  .difficulty { display: flex; gap: 4px; flex-wrap: wrap; }
  .difficulty button { width: 38px; padding: 5px 0; }
  .difficulty button.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .region-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .region-card ul { margin: 6px 0 10px; padding-left: 18px; }
  .boss { display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }

  table.bag { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  table.bag th, table.bag td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: center; }
  table.bag th:first-child, table.bag td:first-child { text-align: left; }
  table.bag td.has { cursor: pointer; }
  table.bag td.has:hover { background: var(--accent-soft); }
  table.bag td.zero { color: var(--faint); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; min-height: 28px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 12px; background: var(--chip); cursor: pointer; }
  .chip:hover { background: var(--chip-hover); }

  .item { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
  .item.worn { border-color: var(--worn-line); background: var(--worn-bg); }
  .item .name { font-weight: 600; }
  .item ul { margin: 4px 0 6px; padding-left: 16px; }
  .item .actions { display: flex; gap: 6px; margin-top: 6px; }
  .slot-col h3 { display: flex; justify-content: space-between; }
  .slot-col .stack { max-height: 70vh; overflow: auto; padding-right: 4px; }

  .link-editor select { width: 100%; }
  .error { color: var(--bad); font-size: 12px; white-space: pre-wrap; }
  .gem-list li { margin-bottom: 4px; }

  .modal-back { position: fixed; inset: 0; background: var(--backdrop); display: none; align-items: center; justify-content: center; z-index: 20; }
  #info-modal { z-index: 25; }
  #ask-modal { z-index: 30; }   /* 確認框要蓋在資料框（例如匯入存檔）上面 */
  .modal-back.open { display: flex; }
  .modal { background: var(--panel); border-radius: 12px; width: min(820px, 94vw); max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 12px 40px var(--shadow); }
  .modal header { position: static; border-radius: 12px 12px 0 0; }
  .modal .body { padding: 12px 18px; overflow: auto; flex: 1; }
  .modal footer { padding: 10px 18px; border-top: 1px solid var(--line); display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .log { font-size: 13px; }
  .log div { padding: 1px 0; }
  .log .turn { color: var(--muted); margin-top: 6px; }
  .log .normal { color: var(--log-normal); }
  .log .skill { color: var(--log-skill); }
  .log .heal { color: var(--log-heal); }
  .log .dot { color: var(--log-dot); }
  .log .miss { color: var(--log-miss); }
  .log .end { font-weight: 600; margin-top: 6px; }
  .log .crit { font-weight: 700; }
  .drop-row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 4px; }
  .chip.drop:hover { background: var(--accent-soft); }
  .log .sys { color: var(--warn); }
  .result { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--result); }
  .result.win { background: var(--result-win); }
  .result.lose { background: var(--result-lose); }
  .subtabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
  .subtabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; padding: 6px 14px; }
  .subtabs button.active { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }
  table.bag td { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  table.bag td.nopick { cursor: default; }
  table.bag td.nopick:hover { background: transparent; }
  table.bag td.sel { background: var(--accent); color: var(--on-accent); }
  table.bag tr.off td { color: var(--faint); }
  .layout.no-side { grid-template-columns: minmax(0, 1fr); }
  .layout.no-side > aside { display: none; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper strong { font-size: 20px; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
  .stepper button { width: 36px; font-size: 16px; padding: 3px 0; }
  .modal.small { width: min(420px, 92vw); }
  .export-text { width: 100%; box-sizing: border-box; font-family: ui-monospace, Menlo, monospace; font-size: 12px; resize: vertical; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--input-bg); color: var(--ink); }
  .name-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .name-row { align-items: center; }
  .name-row input { flex: 1; min-width: 0; font-weight: 600; }
  .avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; overflow: hidden; display: inline-flex; align-items: center; justify-content: center;
    background: var(--accent-soft); color: var(--accent); font-weight: 700; border: 1px solid var(--line); padding: 0; min-height: 0; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar.big { width: 128px; height: 128px; font-size: 40px; }
  .battle-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .battle-head .who { font-weight: 600; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--toast-bg); color: var(--toast-ink); padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; max-width: 80vw; }
  .toast.show { opacity: 1; }
  .toast.bad { background: var(--bad); color: var(--on-accent); }
  .hero-toggle, .hero-brief { display: none; }

  /* ── 手機版面（寬度 760px 以下） ───────────────────────────── */
  @media (max-width: 760px) {
    body { font-size: 15px; }
    button { min-height: 36px; padding: 6px 12px; }
    button.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
    select, input { font-size: 16px; min-height: 36px; }   /* 16px 以上 iOS 才不會自動放大 */
    header { position: static; flex-wrap: wrap; gap: 8px 10px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); }
    header h1 { font-size: 16px; }
    .energy { gap: 6px; font-size: 13px; }
    .header-actions { order: 3; width: 100%; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 2px; }
    .header-actions button { flex: none; }
    nav { order: 4; width: 100%; margin: 0; }
    nav button { flex: 1; padding: 8px 0; }
    .layout { grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
    .layout > aside { order: -1; }
    .panel { padding: 12px; margin-bottom: 10px; }
    .grid2, .grid4 { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .slot-col .stack { max-height: none; }
    .hero-toggle { display: inline-block; float: right; }
    .hero-brief { display: block; font-size: 13px; margin: 2px 0 8px; clear: none; }
    .hero.collapsed dl, .hero.collapsed h3, .hero.collapsed ul, .hero.collapsed > .muted:not(.hero-brief) { display: none; }
    .hero:not(.collapsed) .hero-brief { display: none; }
    .hero dl { grid-template-columns: auto 1fr auto 1fr; gap: 2px 10px; }
    .name-row { clear: both; }
    .stepper button { width: 44px; min-height: 40px; font-size: 18px; }
    .subtabs { gap: 0; }
    .subtabs button { flex: 1; padding: 8px 0; font-size: 14px; white-space: nowrap; }
    table.bag th, table.bag td { padding: 8px 2px; }
    table.bag th:first-child, table.bag td:first-child { white-space: nowrap; padding-right: 6px; }
    .chip { font-size: 13px; padding: 5px 10px; }
    .boss { flex-wrap: wrap; gap: 6px; }
    .modal-back { align-items: stretch; }
    .modal, .modal.small { width: 100vw; max-height: none; height: 100dvh; border-radius: 0; }
    .modal.small { height: auto; margin: auto 0; border-radius: 12px; width: calc(100vw - 24px); margin-left: 12px; }
    .modal header { border-radius: 0; }
    .modal .body { padding: 10px 12px; }
    .modal footer { padding: 8px 12px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    #battle-footer > span.muted { width: 100%; margin-right: 0 !important; }
    .toast { bottom: max(20px, env(safe-area-inset-bottom)); max-width: calc(100vw - 32px); }
  }
</style>
</head>

<header>
  <nav id="nav">
    <button data-tab="adventure" class="active">冒險</button>

<script>
(function () {
  'use strict';
  const { game, save: S, gems: G, compiler, stats: statLayer, affix, craft, drops: dropTable, energy: energyTable, legendary, accessories: AC, monsters: M, bosses: B } = window.Game;

  // ── 小工具 ──────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'disabled' || k === 'selected' || k === 'checked') el[k] = Boolean(v);
      else el.setAttribute(k, v);
    }
    for (const child of children.flat()) if (child !== null && child !== undefined && child !== false) el.append(child.nodeType ? child : document.createTextNode(String(child)));
    return el;
  }
  let toastTimer = null;
  function toast(message, bad = false) {
    const el = $('toast');
    el.textContent = message;
    el.className = 'toast show' + (bad ? ' bad' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = 'toast'; }, 2600);
  }
  function download(name, text, type = 'text/plain') {
    const url = URL.createObjectURL(new Blob([text], { type: type + ';charset=utf-8' }));
    const a = h('a', { href: url, download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  // 匯出：跳出文字框（複製／下載）。Artifact 的頁框會擋下載，複製一定能用；本機開也一樣能用，格式兩邊互通。
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* 改用選取複製 */ }
    try {
      const ta = h('textarea', { style: 'position:fixed;opacity:0;top:0;left:0' });
      ta.value = text; document.body.append(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e) { return false; }
  }
  function showText(title, text, { filename = null, type = 'text/plain', hint = '' } = {}) {
    const area = h('textarea', { class: 'export-text', readonly: true, rows: 8 });
    area.value = text;
    area.addEventListener('focus', () => area.select());
    showInfo(title, [
      hint ? h('p', { class: 'muted', style: 'margin:0 0 6px;font-size:12px', text: hint }) : null,
      area,
      h('div', { class: 'row', style: 'margin-top:8px;justify-content:flex-end' },
        h('button', { class: 'primary', text: '複製', onclick: async () => { const ok = await copyText(text); toast(ok ? '已複製' : '無法自動複製，請長按文字框全選後複製', !ok); } }),
        filename ? h('button', { text: '下載檔案', onclick: () => { try { download(filename, text, type); } catch (e) { toast('這個環境不能下載，請用複製', true); } } }) : null)
    ].filter(Boolean));
  }
  const pct = x => `${Math.round(x * 1000) / 10}%`;
  // 確認框：不用瀏覽器的 confirm()（有些環境會擋掉，按了沒反應）
  function ask(message, yes = '確定') {
    return new Promise(resolve => {
      $('ask-text').textContent = message;
      $('ask-yes').textContent = yes;
      const done = value => { $('ask-modal').classList.remove('open'); $('ask-yes').onclick = $('ask-no').onclick = $('ask-modal').onclick = null; resolve(value); };
      $('ask-yes').onclick = () => done(true);
      $('ask-no').onclick = () => done(false);
      $('ask-modal').onclick = ev => { if (ev.target === $('ask-modal')) done(false); };
      $('ask-modal').classList.add('open');
    });
  }
  // ── 頭像：從本機選圖片，縮成 128×128（置中裁切）存在 localStorage（tbtf-game-avatar），不放進遊戲存檔 ──
  const AVATAR_KEY = 'tbtf-game-avatar';
  const AVATAR_SIZE = 128;
  let avatar = null;
  try { avatar = localStorage.getItem(AVATAR_KEY); } catch (e) {}
  function avatarEl({ big = false, onclick = null, title = null } = {}) {
    const name = state ? game.playerName(state) : '';
    return h(onclick ? 'button' : 'span', { class: 'avatar' + (big ? ' big' : ''), onclick, title, 'aria-label': title || '頭像' },
      avatar ? h('img', { src: avatar, alt: '' }) : [...name][0] || '?');
  }
  function setAvatar(dataUrl) {
    try {
      if (dataUrl) localStorage.setItem(AVATAR_KEY, dataUrl); else localStorage.removeItem(AVATAR_KEY);

  function pickAvatar() {
    const input = $('avatar-input');
    input.value = '';
    input.onchange = async () => {
      const file = input.files[0];
      if (!file) return;
      try {
        const source = await decodeImage(file);
        const w = source.naturalWidth ?? source.width, hgt = source.naturalHeight ?? source.height;
        const side = Math.min(w, hgt);
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = AVATAR_SIZE;
        canvas.getContext('2d').drawImage(source, (w - side) / 2, (hgt - side) / 2, side, side, 0, 0, AVATAR_SIZE, AVATAR_SIZE);
        if (source.close) source.close();
        setAvatar(canvas.toDataURL('image/jpeg', 0.85));
        $('info-modal').classList.remove('open');
        toast('頭像已更新');
      } catch (error) {
        toast(`讀不到這張圖片（${file.type || '未知格式'}）`, true);
      }
    };
    input.click();

  // 解碼圖片：先用 createImageBitmap（不需要網址），不行再用 FileReader 轉成 data: 網址。
  // 不用 URL.createObjectURL：有些環境（例如在 App 裡開啟的本機 HTML）擋掉 blob: 網址，圖片會讀不到。
  async function decodeImage(file) {
    if (window.createImageBitmap) {
      try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { /* 改用下面的方法 */ }
    }
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
    return await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('decode'));
      img.src = dataUrl;
    });
  }

  // ── 戰鬥彈窗 ────────────────────────────────────────────────

  const SPEEDS = [['慢', 250], ['中', 150], ['快', 80], ['立即', 0]];
  let speed = 150;
  let player = null;

  // 共用冷卻：任何一場戰鬥（地區、Boss、再打一場）開打後 10 秒內不能再開打；重播不算。
  // 開打時間存在 localStorage（tbtf-game-battle-cd），重新整理頁面也不能跳過；時間在未來超過冷卻長度（改過系統時間）就視為沒有冷卻。
  const BATTLE_CD_MS = 10000;
  const CD_KEY = 'tbtf-game-battle-cd';
  function cooldownLeft() {
    let last = 0;
    try { last = Number(localStorage.getItem(CD_KEY)) || 0; } catch (e) {}
    const left = last + BATTLE_CD_MS - Date.now();
    return left > 0 && left <= BATTLE_CD_MS ? left : 0;
  }
  // 開打按鈕：冷卻中停用並顯示倒數（每 0.25 秒更新，不重畫整頁）
  function battleButton(label, target, attrs = {}) {

    el.dataset.locked = attrs.disabled ? '1' : '';

    return el;
  }
  function paintBattleButton(el, left = cooldownLeft()) {
    const locked = el.dataset.locked === '1';
    el.disabled = locked || left > 0;
    el.textContent = !locked && left > 0 ? `${el.dataset.label}（${Math.ceil(left / 1000)}）` : el.dataset.label;
  }
  setInterval(() => { const left = cooldownLeft(); document.querySelectorAll('.battle-btn').forEach(el => paintBattleButton(el, left)); }, 250);

  function targetTitle(target, difficulty) {
    if (target.kind === 'boss') return `Boss：${B.findBoss(target.id).name}`;
    return `${M.REGIONS[target.id].name}（難度 ${difficulty ?? target.difficulty}）`;
  }
  async function startBattle(target) {
    const left = cooldownLeft();
    if (left > 0) { toast(`戰鬥冷卻中，還要 ${Math.ceil(left / 1000)} 秒`, true); return; }
    let result;
    try { result = game.runBattle(state, target, game.randomSeed()); } catch (error) { toast(error.message, true); return; }
    try { localStorage.setItem(CD_KEY, String(Date.now())); } catch (e) {}
    const before = new Set(state.equipment.map(item => item.id));
    result.newItems = result.save.equipment.filter(item => !before.has(item.id));
    if (result.victory) {
      try { state = await store.save(result.save); } catch (error) { toast('存檔失敗：' + error.message, true); }
    }
    const title = targetTitle(target, result.difficulty);
    history.unshift({ title, victory: result.victory, turns: result.turns, record: result.record });
    history = history.slice(0, HISTORY_MAX);
    saveHistory();
    showBattle(title, result, { live: true });
    render();

  function openRecord(record, title) {
    let replay;
    try { replay = game.replayBattle(record); } catch (error) { toast('無法重播：' + error.message, true); return; }
    showBattle((title || targetTitle(record.target)) + '（重播）', { ...replay, record }, { live: false });

  // 紀錄：紀錄碼（base64）或 JSON 都能匯入，本機版與 Artifact 版互通
  function parseRecord(text) {
    const t = String(text).trim();
    return t.startsWith('{') ? JSON.parse(t) : decodeRecord(t);
  }
  function showRecord(record) {
    showText('戰鬥紀錄碼', encodeRecord(record), { filename: `battle-${record.seed}.json`, hint: '在冒險頁的「貼上紀錄碼」貼上即可重播；本機開的 game.html 與 Artifact 版都能用。' });
  }
  function encodeRecord(record) { return btoa(unescape(encodeURIComponent(JSON.stringify(record)))); }
  function decodeRecord(code) { return JSON.parse(decodeURIComponent(escape(atob(code)))); }
  // 戰報顏色不分敵我：普攻 = 一般文字色、技能（淺色 #14807a、深色 #4fd1c5）、恢復、持續傷害、閃避各一色；會心一擊加粗
  function logClass(log) {
    if (log.type === 'TURN_START') return 'turn';
    if (log.type === 'BATTLE_START' || log.type === 'TEXT') return 'sys';
    if (log.type === 'BATTLE_END') return 'end';
    if (log.type === 'MISS') return 'miss';
    if (log.type === 'BUFF_EFFECT') return log.buffType === 'DOT' ? 'dot' : log.buffType === 'HOT' ? 'heal' : 'normal';
    if (log.type === 'HEAL' || log.type === 'SP_RECOVER' || log.type === 'REST') return 'heal';
    if (log.skillId && log.isNormalAttack === false) return 'skill';
    return 'normal';
  }
  function showBattle(title, result, { live }) {
    if (player) clearTimeout(player.timer);
    $('battle-title').textContent = title;
    $('battle-avatar').replaceChildren(avatarEl());
    $('battle-who').textContent = game.playerName(live ? state : S.importSave(result.record.snapshot));
    $('battle-sub').textContent = '敵人：' + (result.opening ? result.opening.map(e => `${e.name}（HP ${e.maxHp}）`).join('、') : result.enemies.join('、'));
    const logEl = $('battle-log');
    const scroller = logEl.parentElement;
    logEl.replaceChildren();
    $('battle-result').replaceChildren();
    scroller.scrollTop = 0;
    // 框架的「戰鬥結束，獲勝方: …」換成獲勝方的血量
    const lines = result.logs.filter(log => log.message).map(log => log.type === 'BATTLE_END' && result.summary ? { ...log, message: result.summary } : log);
    player = { lines, index: 0, timer: null, paused: false, done: false, result, title, live };
    const finish = ({ scroll = true } = {}) => {
      while (player.index < lines.length) appendLine();
      player.done = true;

    }
    function step() {
      if (player.paused || player.done) return;
      if (speed === 0) return finish({ scroll: false });   // 立即：只顯示戰報，不捲到底
      appendLine();
      scroller.scrollTop = scroller.scrollHeight;
      if (player.index >= lines.length) return finish();
      player.timer = setTimeout(step, speed);
    }
    player.finish = finish;
    player.step = step;
    $('battle-modal').classList.add('open');
    renderFooter();
    step();
  }
  // 掉落可以點開看資料
  function dropChip(label, onclick) { return h('span', { class: 'chip drop', text: label, title: '點一下看資料', onclick }); }
  function showGemInfo(id) {
    if (G.ACTIVE_GEMS[id]) showInfo(`主動寶石：${gemName(id)}`, [h('div', { text: describeActive(G.ACTIVE_GEMS[id]) }), G.ACTIVE_GEMS[id].description ? h('div', { class: 'muted', style: 'margin-top:6px', text: G.ACTIVE_GEMS[id].description }) : null].filter(Boolean));
    else showInfo(`輔助寶石：${gemName(id)}`, [...compiler.describePlayer(G.SUPPORT_GEMS[id]).map(text => h('div', { text })), h('div', { class: 'muted', style: 'margin-top:8px;font-size:12px', text: '詳細規則' }), h('ul', { class: 'muted', style: 'margin:0;padding-left:18px;font-size:12px' }, compiler.describeSupport(G.SUPPORT_GEMS[id]).lines.map(l => h('li', { text: l.text })))]);
  }
  function resultBox(result, live) {
    const box = h('div', { class: 'result ' + (result.victory ? 'win' : 'lose') },
      h('strong', { text: result.victory ? `勝利！（${result.turns} 回合）` : (result.winner === 'TEAM_B' ? `敗北（${result.turns} 回合）` : `時間到，未分勝負（${result.turns} 回合）`) }));
    if (!live) { box.append(h('div', { class: 'muted', text: '重播不會改變存檔' })); return box; }
    if (result.victory && result.drops) {
      const d = result.drops;
      const row = (label, chips) => chips.length ? h('div', { class: 'drop-row' }, h('span', { class: 'muted', text: label }), ...chips) : null;
      const legends = (result.newItems || []).filter(item => item.legendaryId);
      box.append(...[
        row('刻印', d.engravings.map(e => dropChip(`${kindName(e.type)} ${e.tier} 階`, () => showEngravingInfo(e.type, e.tier)))),
        row('輔助寶石', d.supportGems.map(id => dropChip(gemName(id), () => showGemInfo(id)))),
        row('傳說裝備', legends.map(item => dropChip(itemName(item), () => showInfo(itemName(item), [itemCard(item, { compact: true })])))),
        h('div', { class: 'muted', text: `能量 +${d.energy}${d.engravings.length || d.supportGems.length || legends.length ? '　（點掉落可以看資料）' : ''}` })
      ].filter(Boolean));
      if (result.info?.rare) box.append(h('div', { class: 'muted', text: '遇到稀有怪：額外刻印' }));
      if (result.info?.elite && !result.info?.boss) box.append(h('div', { class: 'muted', text: '遇到菁英怪：額外刻印' }));
    }

  // ── 工坊：製作裝備／刻印到裝備／刻印合成／分解刻印（第二層分頁，每頁都有刻印表） ──
  const TIERS = [1, 2, 3, 4, 5];
  const WORKSHOP_TABS = [['craft', '製作裝備'], ['engrave', '刻印到裝備'], ['combine', '刻印合成'], ['salvage', '分解刻印']];
  function bagCount(kind, tier, extraUsed = []) {
    const key = `${kind}@${tier}`;
    return (state.engravings[key] ?? 0) - extraUsed.filter(k => k === key).length;
  }
  // 刻到裝備時的數值範圍（ROLL_MIN～1 × 上限 × 階級縮放；3 行隨機取 2 行）。製作裝備時的數值不顯示（使用者決定）。
  const INT_STATS = new Set(['hp', 'sp', 'atk', 'int', 'def', 'spd', 'hit', 'eva']);
  function lineRange(entry, tier) {
    const hi = entry.max * affix.TIER_SCALE[tier], lo = hi * affix.ROLL_MIN;
    if (entry.kind !== 'stat') {
      const name = EFFECT_NAMES[entry.kind] ?? entry.kind;
      return `${name} +${pct(lo)}～${pct(hi)}`;
    }
    const def = statLayer.STAT_DEFS[entry.stat];
    if (entry.op === 'inc') return `${def.name}提高 ${pct(lo)}～${pct(hi)}`;
    if (def.display === 'percent') return `${def.name} +${pct(lo)}～${pct(hi)}`;
    const fmt = v => INT_STATS.has(entry.stat) ? Math.round(v) : +v.toFixed(2);
    return `${def.name} +${fmt(lo)}～${fmt(hi)}`;
  }
  function showEngravingInfo(kind, tier) {
    const def = affix.ENGRAVING_TYPES[kind];
    showInfo(`${def.name} ${tier} 階`, [
      h('div', { class: 'muted', style: 'margin-bottom:6px', text: `刻到裝備時從下面 ${affix.LINES_PER_ENGRAVING} 行隨機取 2 行，數值在範圍內隨機。` }),
      h('ul', { style: 'margin:0;padding-left:18px' }, def.lines.map(entry => h('li', { text: lineRange(entry, tier) }))),
      h('div', { class: 'muted', style: 'margin-top:6px', text: `能刻的部位：${affix.ENGRAVING_SLOTS[kind].map(s => SLOT_NAMES[s]).join('、')}｜背包有 ${bagCount(kind, tier)} 個` })
    ]);
  }
  // 右鍵（電腦）或長按（手機）看數值；長按後的那次點擊不算點選
  function bindInfo(el, kind, tier) {
    let timer = null, longPressed = false;
    el.addEventListener('contextmenu', ev => { ev.preventDefault(); showEngravingInfo(kind, tier); });
    el.addEventListener('touchstart', () => { longPressed = false; timer = setTimeout(() => { longPressed = true; showEngravingInfo(kind, tier); }, 500); }, { passive: true });
    const cancel = () => clearTimeout(timer);
    el.addEventListener('touchend', cancel); el.addEventListener('touchmove', cancel); el.addEventListener('touchcancel', cancel);
    el.addEventListener('click', ev => { if (longPressed) { ev.stopImmediatePropagation(); ev.preventDefault(); longPressed = false; } }, true);
  }
  /** 刻印表：used = 已選走的（從數量扣掉）；allowed(kind, tier) = 這格能不能點；selected = 目前選中的格。 */
  function renderBag({ onPick = null, used = [], allowed = () => true, selected = null } = {}) {
    return h('table', { class: 'bag' },
      h('tr', {}, h('th', { text: '刻印' }), TIERS.map(t => h('th', { text: `${t} 階` }))),
      KINDS.map(kind => h('tr', { class: TIERS.some(t => allowed(kind, t)) ? '' : 'off' }, h('td', { text: kindName(kind) }), TIERS.map(tier => {

        const cell = h('td', { class: [n > 0 ? 'has' : 'zero', can ? 'pick' : 'nopick', isSel ? 'sel' : ''].join(' '), text: n, onclick: can ? () => onPick(kind, tier) : null });
        bindInfo(cell, kind, tier);
        return cell;
      }))));
  }
  const bagHint = text => h('p', { class: 'muted', style: 'margin:8px 0 4px', text: text + '　在數量上按右鍵（手機長按）可以看刻到裝備時的數值。' });

  function craftView() {

      renderBag({ onPick: (kind, tier) => { if (picks.length < craft.CRAFT_INPUTS) { picks.push({ type: kind, tier }); render(); } }, used: picks.map(p => `${p.type}@${p.tier}`), allowed: () => picks.length < craft.CRAFT_INPUTS }),

        h('span', { class: 'muted', style: 'font-size:12px', text: `最多 ${S.ITEM_NAME_MAX} 字；完整名稱是「品質的名字」，例如「上等的堅韌布甲」` })),

          v => { ui.craftPicks = []; ui.craftName = ''; const item = v.save.equipment.find(x => x.id === v.id); return `做出了 ${itemName(item)}（${QUALITY[v.quality].name} ×${QUALITY[v.quality].mult}）`; }) }),

    if (sel && (!affix.canEngrave(sel.kind, item.slot) || bagCount(sel.kind, sel.tier) <= 0)) ui.engraveSel = null;
    return h('div', { class: 'grid2' },
      h('div', { class: 'panel' }, h('h2', { text: '刻印到裝備' }),
        h('div', { class: 'row' }, '裝備', h('select', { onchange: ev => { ui.engraveItem = ev.target.value; ui.engraveSel = null; render(); } },
          crafted.map(x => h('option', { value: x.id, selected: x.id === ui.engraveItem, text: `${itemName(x)}${state.equipped[x.slot] === x.id ? '（穿著）' : ''}　${S.itemEngravings(x).length}/${affix.ENGRAVINGS_PER_ITEM}` })))),
        bagHint(full ? `已刻滿 ${affix.ENGRAVINGS_PER_ITEM} 個；要換請先在右邊清除。` : `點刻印表選一個，再按「刻印」。灰色的種類不能刻在${SLOT_NAMES[item.slot]}。`),

          } }))),
      h('div', { class: 'panel' }, h('h2', { text: '這件裝備' }),
        itemCard(item, { compact: true }),
        h('h3', { style: 'margin-top:12px', text: `已刻的刻印（${current.length}/${affix.ENGRAVINGS_PER_ITEM}）` }),
        current.length ? h('div', { class: 'stack' }, current.map((key, i) => {
          const tier = Number(key.split('@')[1]);

            h('button', { class: 'small' + (ui.transfer?.fromId === item.id && ui.transfer.index === i ? ' primary' : ''), text: `轉移（${energyTable.TRANSFER_ENERGY} 能量）`,

            } }));

        h('p', { class: 'muted', style: 'margin:8px 0 0', text: `清除費用（1～5 階）：${Object.values(energyTable.CLEAR_COST).join('／')} 能量；目前 ${e}。` }),

  }
  // 轉移刻印：選了來源刻印後，列出同部位的其他可刻印裝備（目標刻滿時要選清除哪一個，另外花清除費）
  function transferPanel(item, current, crafted) {

              apply(s => S.combineAllEngravings(s, kind, t), v => `合成出 ${v.made} 個 ${kindName(v.type)} ${v.tier} 階（剩 ${v.left} 個 ${v.tier - 1} 階）`);

  // 換分頁時清掉所有選擇（不清的話，別頁用掉同一批刻印會讓這頁的數量變負數）
  function clearWorkshopPicks() {
    ui.craftPicks = []; ui.combinePicks = []; ui.engraveSel = null; ui.transfer = null; ui.salvage = { kind: null, tier: 1, count: 1 };
  }
  // 保險：選了但背包已經不夠（例如匯入存檔、分解或戰鬥改了背包）的選擇丟掉，數量不會出現負數
  function prunePicks(list, keyOf) {
    const left = { ...state.engravings };
    return list.filter(p => { const key = keyOf(p); if ((left[key] ?? 0) <= 0) return false; left[key]--; return true; });
  }
  function renderWorkshop() {
    ui.craftPicks = prunePicks(ui.craftPicks, p => `${p.type}@${p.tier}`);
    ui.combinePicks = prunePicks(ui.combinePicks, p => `${p.kind}@${p.tier}`);
    const views = { craft: craftView, engrave: engraveView, combine: combineView, salvage: salvageView };
    return [h('div', { class: 'subtabs' }, WORKSHOP_TABS.map(([id, name]) => h('button', { class: ui.workshopTab === id ? 'active' : '', text: name, onclick: () => { if (ui.workshopTab !== id) clearWorkshopPicks(); ui.workshopTab = id; render(); } }))),
      views[ui.workshopTab]()];
  }


  // ── 裝備 ────────────────────────────────────────────────────
  function itemCard(item, { compact = false } = {}) {
    const worn = state.equipped[item.slot] === item.id;
    const engravings = S.itemEngravings(item);
    const lines = [
      ...item.base.map(b => statLayer.describeStatBonus(b).text),
      ...item.affixes.map(a => describeAffix(a) + (a.source?.startsWith('engraving:') ? `（${engravingLabel(a.source.slice(10))}）` : a.source?.startsWith('craft:') ? '（製作詞綴）' : a.source?.startsWith('legendary:') ? '（獨有）' : ''))
    ];
    const mech = legendary.mechanicsOf(item).map(m => legendary.describeMechanic(m, gemName));
    const links = S.equippedLinks({ ...state, equipped: { weapon: null, helmet: null, armor: null, boots: null, [item.slot]: item.id } });
    return h('div', { class: 'item' + (worn ? ' worn' : '') },
      h('div', { class: 'name' }, itemName(item), h('span', { class: 'muted', style: 'font-weight:normal', text: `　${SLOT_NAMES[item.slot]}` }),
        worn ? h('span', { class: 'tag equipped', text: '穿著' }) : null, item.legendaryId ? h('span', { class: 'tag legend', text: '傳說' }) : null),
      h('ul', {}, lines.map(t => h('li', { text: t })), mech.map(t => h('li', { text: t }))),
      compact ? null : h('div', { class: 'muted', style: 'font-size:12px' },
        `施放權重 ${item.castWeight}`, item.slot === 'weapon' ? `｜普攻屬性：${(item.attackStat ?? 'atk') === 'int' ? '智力' : '攻擊'}` : '',
        S.ENGRAVABLE_ORIGINS.includes(item.origin) ? `｜刻印 ${engravings.length}/${affix.ENGRAVINGS_PER_ITEM}` : '',
        links.length ? `｜寶石：${links.map(l => [l.active, ...(l.supports || [])].map(gemName).join('＋')).join('；')}` : ''),
      compact ? null : h('div', { class: 'actions' },
        ui.salvageMode
          ? (item.legendaryId
            ? h('button', { class: 'small danger', text: `分解（得 ${S.BLACK_DICE_PER_SALVAGE} 顆黑骰）`,
              onclick: async () => { if (await ask(`分解傳說裝備 ${itemName(item)}？得到 ${S.BLACK_DICE_PER_SALVAGE} 顆黑骰，鑲著的寶石退回背包。`, '分解')) apply(s => S.salvageEquipment(s, item.id), v => `已分解 ${itemName(item)}，得到 ${v.blackDice} 顆黑骰`); } })
            : h('button', { class: 'small danger', disabled: !item.materials, title: item.materials ? null : '只有用刻印製作的裝備與傳說裝備能分解',
              text: item.materials ? `分解（退回 ${craft.SALVAGE_RETURN} 個刻印）` : '不能分解',
              onclick: async () => { if (await ask(`分解 ${itemName(item)}？會隨機退回 ${craft.SALVAGE_RETURN} 個當初投入的刻印，鑲著的寶石退回背包。`, '分解')) apply(s => S.salvageEquipment(s, item.id), v => '退回：' + v.returned.map(engravingLabel).join('、')); } }))
          : worn ? h('button', { class: 'small', text: '脫下', onclick: () => apply(s => S.unequip(s, item.slot), item.links?.length ? '已脫下，寶石退回背包' : null) })
            : h('button', { class: 'small primary', text: '穿上', onclick: () => {
              const old = state.equipment.find(x => x.id === state.equipped[item.slot]);
              apply(s => S.equip(s, item.id), old?.links?.length ? `已換上，${itemName(old)}的寶石退回背包` : null);
            } }),
        !ui.salvageMode && item.origin === 'craft' && item.affixes.some(a => a.source?.startsWith('craft:')) ? h('span', { class: 'row', style: 'gap:4px' },
          h('button', { class: 'small', disabled: state.blackDice < S.BLACK_DICE_REROLL_COST, title: state.blackDice < S.BLACK_DICE_REROLL_COST ? '沒有黑骰：分解傳說裝備可以拿到' : null,
            text: `黑骰重骰詞綴（${S.BLACK_DICE_REROLL_COST} 顆）`,
            onclick: async () => { if (await ask(`用 ${S.BLACK_DICE_REROLL_COST} 顆黑骰重骰 ${itemName(item)} 的製作詞綴？種類和數值都重新抽（照製作時投入的刻印階級）。`, '重骰'))
              apply(s => S.rerollCraftAffix(s, item.id), v => '重骰後：' + v.after.map(describeAffix).join('、')); } }),
          h('button', { class: 'small', disabled: state.blackDice < S.BLACK_DICE_REROLL_COST || state.energy < energyTable.CRAFT_REROLL_LOCK_ENERGY,
            text: `鎖定種類重擲數值（${S.BLACK_DICE_REROLL_COST} 顆＋${energyTable.CRAFT_REROLL_LOCK_ENERGY} 能量）`,
            onclick: async () => { if (await ask(`用 ${S.BLACK_DICE_REROLL_COST} 顆黑骰和 ${energyTable.CRAFT_REROLL_LOCK_ENERGY} 能量重擲 ${itemName(item)} 的製作詞綴數值？種類不變。`, '重擲'))
              apply(s => S.rerollCraftAffix(s, item.id, { lockKind: true }), v => '重擲後：' + v.after.map(describeAffix).join('、')); } })) : null,
        !ui.salvageMode && item.legendaryId ? h('button', { class: 'small', disabled: state.blackDice < S.BLACK_DICE_REROLL_COST,
          title: state.blackDice < S.BLACK_DICE_REROLL_COST ? '沒有黑骰：分解傳說裝備可以拿到' : null,
          text: `黑骰重置數值（${S.BLACK_DICE_REROLL_COST} 顆）`,
          onclick: async () => { if (await ask(`用 ${S.BLACK_DICE_REROLL_COST} 顆黑骰重置 ${itemName(item)} 的所有數值？會依掉落時的階級重擲基礎數值與獨有詞綴，可能變高也可能變低；施放權重和鑲的寶石不變。`, '重置'))
            apply(s => S.rerollLegendary(s, item.id), v => '重置後：' + [...v.after.base.map(b => statLayer.describeStatBonus(b).text), ...v.after.affixes.map(describeAffix)].join('、')); } }) : null));
  }
  function renderEquipment() {
    const bySlot = slot => state.equipment.filter(item => item.slot === slot).sort((a, b) => (state.equipped[slot] === b.id) - (state.equipped[slot] === a.id));
    return [h('div', { class: 'panel' },
      h('div', { class: 'row', style: 'justify-content:space-between;margin-bottom:10px' },
        h('h2', { style: 'margin:0', text: `裝備（${state.equipment.length} 件）` }),
        h('button', { class: 'toggle danger' + (ui.salvageMode ? ' active' : ''), text: ui.salvageMode ? '分解模式：開' : '分解模式：關', onclick: () => { ui.salvageMode = !ui.salvageMode; render(); } })),
      h('div', { class: 'grid4' }, Object.entries(SLOT_NAMES).map(([slot, name]) => h('div', { class: 'slot-col' },
        h('h3', {}, name, h('span', { class: 'muted', style: 'font-weight:normal', text: `${bySlot(slot).length} 件` })),
        h('div', { class: 'stack' }, bySlot(slot).length ? bySlot(slot).map(item => itemCard(item)) : h('div', { class: 'muted', text: '沒有' })))))),
      accessoryPanel()];
  }
  // 飾品：只有 1 欄、擁有制、只有固定的特殊詞綴（accessoryTable）
  function accessoryPanel() {
    const acc = state.accessories;
    return h('div', { class: 'panel' },
      h('h2', { text: `${AC.ACCESSORY_LABEL}（1 欄；擁有 ${acc.owned.length} 個）` }),
      acc.owned.length ? h('div', { class: 'grid4' }, acc.owned.map(id => {
        const def = AC.ACCESSORIES[id];
        const worn = acc.equipped === id;
        return h('div', { class: 'item' + (worn ? ' worn' : '') },
          h('strong', { text: def.name + (worn ? '（穿著）' : '') }),
          h('ul', { style: 'margin:4px 0;padding-left:18px' }, def.affixes.map(a => h('li', { text: describeAffix(a) }))),
          h('button', { class: 'small' + (worn ? '' : ' primary'), text: worn ? '脫下' : '穿上',
            onclick: () => apply(s => S.equipAccessory(s, worn ? null : id), worn ? `脫下${def.name}` : `穿上${def.name}`) }));
      })) : h('div', { class: 'muted', text: `沒有${AC.ACCESSORY_LABEL}（打王首次擊敗可以拿到）` }));
  }

  // ── 寶石 ────────────────────────────────────────────────────
  function linkEditor(slot) {
    const id = state.equipped[slot];
    const item = state.equipment.find(x => x.id === id);
    if (!item) return h('div', { class: 'panel' }, h('h3', { text: SLOT_NAMES[slot] }), h('div', { class: 'muted', text: '沒有穿裝備' }));
    const link = (item.links || [])[0] || { active: null, supports: [] };
    const draft = ui[`link_${slot}`] && ui[`link_${slot}`].itemId === id ? ui[`link_${slot}`] : { itemId: id, active: link.active, supports: [...(link.supports || [])] };
    ui[`link_${slot}`] = draft;
    // 主動寶石擁有制：有就能選；輔助寶石算背包＋這件已鑲的
    const has = gemId => G.ACTIVE_GEMS[gemId] ? (state.gems[gemId] ?? 0) : (state.gems[gemId] ?? 0) + (link.supports || []).filter(g => g === gemId).length;
    const activeOptions = Object.keys(G.ACTIVE_GEMS).filter(g => has(g) > 0);
    const supportOptions = Object.keys(G.SUPPORT_GEMS).filter(g => has(g) > 0);
    const granted = legendary.mechanicsOf(item).filter(m => m.type === 'grantSupport').map(m => gemName(m.gem));
    return h('div', { class: 'panel link-editor' },
      h('h3', {}, SLOT_NAMES[slot], h('span', { class: 'muted', style: 'font-weight:normal', text: `　${itemName(item)}　權重 ${item.castWeight}` })),
      h('div', { class: 'stack' },
        h('label', {}, '主動寶石', h('select', { onchange: ev => { draft.active = ev.target.value || null; if (!draft.active) draft.supports = []; } },
          h('option', { value: '', text: '（不放）' }), activeOptions.map(g => h('option', { value: g, selected: g === draft.active, text: gemName(g) })))),
        Array.from({ length: G.MAX_SUPPORTS }, (_, i) => h('label', {}, `輔助 ${i + 1}`, h('select', { onchange: ev => { draft.supports[i] = ev.target.value || null; } },
          h('option', { value: '', text: '（不放）' }), supportOptions.map(g => h('option', { value: g, selected: g === draft.supports[i], text: `${gemName(g)}（有 ${has(g)}）` }))))),
        granted.length ? h('div', { class: 'muted', style: 'font-size:12px', text: `裝備額外給：${granted.join('、')}（不佔位）` }) : null,
        h('div', { class: 'row' },
          h('button', { class: 'primary small', text: '套用', onclick: () => {
            const supports = draft.supports.filter(Boolean);
            const links = draft.active ? [{ active: draft.active, supports }] : [];
            // 不合法時只在這一欄顯示一次（錯誤訊息本身已含問題清單，不再另外附加，也不跳提示）
            try { S.setLinks(state, id, links); } catch (error) { ui.linkErrors[slot] = String(error.message || error).replace(/「(\w+)」/g, (m, gid) => `「${gemName(gid)}」`); render(); return; }
            ui.linkErrors[slot] = null;
            apply(s => S.setLinks(s, id, links), '寶石連結已更新');
          } }),
          h('button', { class: 'small', text: '還原', onclick: () => { delete ui[`link_${slot}`]; ui.linkErrors[slot] = null; render(); } })),
        ui.linkErrors[slot] ? h('div', { class: 'error', text: ui.linkErrors[slot] }) : null));
  }
  function describeActive(gem) {
    const dmg = gem.actions.filter(a => a.type === 'DAMAGE');
    const parts = [`SP ${gem.spCost}`, gem.tags.includes('spell') ? '法術' : '物理'];
    for (const a of dmg) parts.push(`${a.targetType === 'ENEMY_ALL' ? '全體' : '單體'} ${Math.round((a.power ?? 1) * 100)}%`);
    for (const a of dmg) for (const ail of a.ailments || []) parts.push(`附加${G.AILMENTS[ail.kind]?.name ?? ail.kind}（${ail.basis === 'hit' ? '命中傷害' : '攻擊力'}的 ${Math.round(ail.power * 100)}%，${ail.duration} 槽）`);
    if (gem.actions.some(a => a.type === 'HEAL')) parts.push('治療');
    if (gem.critEcho) parts.push(`根據爆擊率額外釋放一次（${Math.round(gem.critEcho.power * 100)}%）`);   // 2026-11-21 使用者：火焰風暴補上這句
    return parts.join('｜');
  }
  function renderGems() {
    const owned = Object.entries(state.gems).filter(([, n]) => n > 0);
    const actives = owned.filter(([id]) => G.ACTIVE_GEMS[id]);
    const supports = owned.filter(([id]) => G.SUPPORT_GEMS[id]);
    // 轉換的選擇：背包已經不夠的丟掉（例如剛鑲上去）
    const left = Object.fromEntries(supports);
    ui.convertPicks = ui.convertPicks.filter(id => (left[id] = (left[id] ?? 0) - 1) >= 0);
    const cp = ui.convertPicks;
    return [h('div', { class: 'grid4' }, Object.keys(SLOT_NAMES).map(linkEditor)),
      h('div', { class: 'grid2' },
        h('div', { class: 'panel' }, h('h2', { text: '已擁有的主動寶石' }), h('p', { class: 'muted', style: 'font-size:12px;margin:0 0 6px', text: '擁有一次就能鑲在任意多件裝備上；穿在身上的裝備裡同一種只能有一顆。' }), actives.length ? h('ul', { class: 'gem-list' }, actives.map(([id]) => h('li', {}, h('strong', { text: gemName(id) }), h('div', { class: 'muted', style: 'font-size:12px', text: describeActive(G.ACTIVE_GEMS[id]) })))) : h('div', { class: 'muted', text: '沒有' })),
        h('div', { class: 'panel' }, h('h2', { text: '背包：輔助寶石' }), supports.length ? h('ul', { class: 'gem-list' }, supports.map(([id, n]) => h('li', {},
          h('strong', { text: `${gemName(id)} ×${n}` }),
          h('button', { class: 'small', style: 'margin-left:6px', disabled: cp.length >= S.GEM_CONVERT_INPUTS || cp.filter(x => x === id).length >= n, text: '放入轉換', onclick: () => { ui.convertPicks.push(id); render(); } }),
          ...compiler.describePlayer(G.SUPPORT_GEMS[id]).map(text => h('div', { class: 'muted', style: 'font-size:12px', text }))))) : h('div', { class: 'muted', text: '沒有（打怪會掉）' }),
          h('h2', { style: 'margin-top:12px', text: `寶石轉換（${S.GEM_CONVERT_INPUTS} → 1）` }),
          h('p', { class: 'muted', style: 'font-size:12px;margin:0 0 6px', text: `投入 ${S.GEM_CONVERT_INPUTS} 顆輔助寶石（可同種、可混），從你還沒有的種類隨機換 1 顆；全部都有時，從投入以外的種類隨機。（${cp.length} / ${S.GEM_CONVERT_INPUTS}，點已放入的可移除）` }),
          h('div', {}, cp.map((id, i) => h('button', { class: 'small', style: 'margin:0 4px 4px 0', text: `${gemName(id)} ✕`, onclick: () => { ui.convertPicks.splice(i, 1); render(); } }))),
          h('button', { class: 'primary', disabled: cp.length !== S.GEM_CONVERT_INPUTS, text: '轉換', onclick: () => apply(s => S.convertGems(s, cp),
            v => { ui.convertPicks = []; return `轉換出 ${gemName(v.gemId)}${v.fromMissing ? '（你還沒有的種類）' : ''}`; }) })))];
  }

  // ── 畫面 ────────────────────────────────────────────────────
  function render() {
    if (!state) return;
    for (const b of document.querySelectorAll('#nav button')) b.classList.toggle('active', b.dataset.tab === tab);
    const views = { adventure: renderAdventure, workshop: renderWorkshop, equipment: renderEquipment, gems: renderGems };
    $('main').replaceChildren(...views[tab]());
    document.querySelector('.layout').classList.toggle('no-side', !['adventure', 'equipment'].includes(tab));
    renderHero();
  }
  function pickFile(onText) {
    const input = $('file-input');
    input.value = '';
    input.onchange = () => { const file = input.files[0]; if (!file) return; file.text().then(text => { try { onText(text); } catch (e) { toast('檔案內容不正確：' + e.message, true); } }); };
    input.click();
  }

  document.querySelectorAll('#nav button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; render(); }));
  // 存檔匯出／匯入：文字（JSON）與檔案兩種方式，本機版與 Artifact 版互通（同一個格式；頭像、戰鬥紀錄、主題不在存檔裡）
  $('export-save').addEventListener('click', () => showText('匯出存檔', S.exportSave(state), {
    filename: `save-${new Date().toISOString().slice(0, 10)}.json`, type: 'application/json',
    hint: '複製這段文字，到另一邊（本機 game.html 或 Artifact 版）按「匯入存檔」貼上。也可以下載成檔案（Artifact 裡不能下載）。' }));
  async function importSaveText(text) {
    let next;
    try { next = S.importSave(String(text).trim()); } catch (e) { toast('存檔內容不正確：' + e.message, true); return; }
    if (!(await ask('匯入會取代目前的存檔，確定？', '匯入'))) return;
    state = await store.save(next);
    $('info-modal').classList.remove('open');
    toast('已匯入存檔');
    render();
  }
  $('import-save').addEventListener('click', () => {
    const area = h('textarea', { class: 'export-text', rows: 8, placeholder: '貼上匯出的存檔文字' });
    showInfo('匯入存檔', [
      h('p', { class: 'muted', style: 'margin:0 0 6px;font-size:12px', text: '貼上存檔文字，或選擇存檔檔案（.json）。匯入會取代目前的存檔。' }),
      area,
      h('div', { class: 'row', style: 'margin-top:8px;justify-content:flex-end' },
        h('button', { text: '選擇檔案', onclick: () => pickFile(text => importSaveText(text)) }),
        h('button', { class: 'primary', text: '匯入', onclick: () => { if (area.value.trim()) importSaveText(area.value); else toast('請先貼上存檔文字', true); } }))
    ]);
  });
  $('reset-save').addEventListener('click', async () => {
    if (!(await ask('重新開始會清掉目前的存檔（戰鬥紀錄保留）。建議先匯出存檔。確定？', '重新開始'))) return;
    state = await store.save(game.createNewGame());
    toast('已重新開始');
    render();
  });
  // 深色／淺色切換（存在 localStorage，和遊戲存檔分開）
  const THEME_KEY = 'tbtf-game-theme';
  function paintThemeButton() {
    const dark = document.documentElement.dataset.theme === 'dark';
    $('theme-toggle').textContent = dark ? '淺色模式' : '深色模式';
    $('theme-toggle').setAttribute('aria-pressed', String(dark));
  }
  $('theme-toggle').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    paintThemeButton();
  });
  paintThemeButton();
  $('info-close').addEventListener('click', () => $('info-modal').classList.remove('open'));
  $('info-modal').addEventListener('click', ev => { if (ev.target === $('info-modal')) $('info-modal').classList.remove('open'); });
  $('battle-modal').addEventListener('click', ev => { if (ev.target === $('battle-modal') && player?.done) closeBattle(); });

  (async function init() {
    loadHistory();
    try { state = await store.load(); } catch (error) { toast('讀檔失敗：' + error.message + '（沒有覆蓋舊存檔）', true); }
    if (!state) state = await store.save(game.createNewGame());
    if (!storageOk) setTimeout(() => toast('這裡不能使用瀏覽器儲存，關掉頁面存檔就會消失；請記得匯出存檔', true), 600);
    else { const tidy = S.releaseUnwornLinks(state); if (tidy !== state) { state = await store.save(tidy); toast('沒穿著的裝備上的寶石已退回背包'); } }
    render();
    window.GameUI = { get state() { return state; }, forceState: next => { state = next; render(); }, render, startBattle, openRecord, closeBattle, setTab: t => { tab = t; render(); }, ui };
  })();
})();
</script>
</body>
</html>
