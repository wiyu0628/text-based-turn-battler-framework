  value: null,
  isCrit: false,
  blocked: false,
  blockMethod: null,
  evadeMethod: null,
  // 僅 SUMMON：這次招來的是不是站在對面的敵對增援。
  hostile: false,
  hitIndex: 1,
  buff: null,
  skill,
  ...overrides
});

/**
 * 依 action type 把片段拼成一句戰報。action.message 存在時直接整句覆寫。
 * @param {Object} action 該段動作定義
 * @param {Object} ctx makeContext 產生的 context
 * @param {Object} [flags]
 * @param {Boolean} [flags.isComboHit] DAMAGE：是否為連擊的第 2 擊之後
 * @param {Boolean} [flags.isHitLanded] DAMAGE：命中或落空
 */
function composeMessage(action, ctx, { isComboHit = false, isHitLanded = true } = {}) {
  if (action.message) return action.message(ctx);

  const text = { ...DefaultText[action.type], ...(action.text || {}) };
  const part = (p) => resolvePart(p, ctx);

  if (action.type === 'HEAL') return part(text.action) + part(text.heal);
  if (action.type === 'RESTORE_SP') return part(text.action) + part(text.recover);
  if (action.type === 'CHANGE_SANITY') return part(text.action) + part(text.sanity);
  if (action.type === 'SUMMON') return part(text.action) + part(text.summon);
  if (action.type === 'BUFF') return part(text.action) + part(text.buff);
  if (action.type === 'TEXT') return part(text.action);

  const lead = part(isComboHit ? text.combo : text.action);
  if (!isHitLanded) return lead + part(text.miss);
  if (ctx.blocked) return lead + part(text.block);
  return lead + (ctx.isCrit ? part(text.crit) : '') + part(text.hit);
}

/**
 * 一次施放的結果（CastReport，1.0.47）：execute 的回傳值。
 *
 * 給「打中才觸發」的附帶效果用：昏迷、流血、感染該掛在**實際被打的人**身上，
 * 而不是呼叫端原本想打的那個人。以前拿不到這份資料，遊戲層只能翻 logger.logs 找 MISS、
 * 或在打之前記下血量再比較，兩種都會在目標被換掉（混亂反轉）、護盾吸收、同時被治療時判錯。
 *
 * 範圍是這一次 execute 的傷害段，跟 AFTER_ATTACK_DEALT 同一條界線：
 * 別人的反擊、CAST_SKILL 叫出來的子技能各有自己的結果，不算在這裡。
 * 覆寫了 execute 的技能不一定會把結果往上傳，只有直接走基底 Skill 的呼叫保證拿得到。
 *
 * targets 每個目標一筆，依第一次出手的順序：
 *   attempts 出手幾擊（含落空、被反擊截下的）；missed 落空；countered 被反擊截下；
 *   landed 真的打到身上的擊數（含被格擋、被護盾吃掉）；blocked 其中被格擋的；crits 爆擊；
 *   damage 戰報上的傷害合計；actualDamage 實際扣掉的 HP；shieldAbsorbed 護盾吸收；defeated 施放結束時已倒下。
 * landed（陣列）是至少打到一擊的目標，給最常見的「打中的人身上掛效果」用。
 */
function createCastReport(skill, caster) {
  return { skill, caster, targets: [], landed: [] };
}

function castEntry(report, target) {
  if (!report) return null;
  let entry = report.targets.find(item => item.target === target);
  if (!entry) {
    entry = { target, attempts: 0, landed: 0, missed: 0, countered: 0, blocked: 0, crits: 0,
      damage: 0, actualDamage: 0, shieldAbsorbed: 0, defeated: false };
    report.targets.push(entry);
  }
  return entry;
}

function finishCastReport(report) {
  for (const entry of report.targets) entry.defeated = !entry.target.isAlive;
  report.landed = report.targets.filter(entry => entry.landed > 0).map(entry => entry.target);
  return report;
}

class Skill {
  constructor({ id, name, actions = [], tier = 'standard', counterStyle = 'summary',
    uncounterable = false, counterChanceMultiplier = 1, uncritable = false, tags }) {
    // 打錯字若安靜地退回 summary，就只會看到「反擊怎麼沒照我寫的演出」，
    // 而那跟「這場剛好沒反擊」在戰報上長得一樣。
    if (!['summary', 'detailed'].includes(counterStyle)) {
      throw new Error(`Skill "${id}" has unknown counterStyle "${counterStyle}".`);
    }
    if (typeof uncounterable !== 'boolean') {
      throw new Error(`Skill "${id}" uncounterable must be a boolean.`);
    }
    if (typeof uncritable !== 'boolean') {
      throw new Error(`Skill "${id}" uncritable must be a boolean.`);
    }
    if (!Number.isFinite(counterChanceMultiplier) ||
        counterChanceMultiplier < 0 || counterChanceMultiplier > 1) {
      throw new Error(`Skill "${id}" counterChanceMultiplier must be between 0 and 1.`);
    }
    for (const action of actions) {
      if (action.type === 'CHANGE_SANITY' && !Number.isFinite(action.amount)) {
        throw new Error('CHANGE_SANITY requires a finite amount');
      }
      if (action.ignoreShield !== undefined && (action.type !== 'DAMAGE' || !(typeof action.ignoreShield === 'boolean' ||
          (typeof action.ignoreShield === 'number' && Number.isFinite(action.ignoreShield) && action.ignoreShield >= 0 && action.ignoreShield <= 1)))) {
        throw new Error('ignoreShield requires a DAMAGE action and a boolean or a number in [0, 1]');
      }
      if (action.ignoreInvincible !== undefined && (action.type !== 'DAMAGE' || typeof action.ignoreInvincible !== 'boolean')) {
        throw new Error('ignoreInvincible requires a DAMAGE action and a boolean');
      }
      if (action.damageMultiplier !== undefined && (action.type !== 'DAMAGE' || !Number.isFinite(action.damageMultiplier) || action.damageMultiplier < 0)) {
        throw new Error('damageMultiplier requires a DAMAGE action and a finite nonnegative value');
      }
      // ignoreDefense 可以是布林，或 0～1 的比例（1.0.57，防禦 × (1 - 比例)）。
      if (action.ignoreDefense !== undefined && (action.type !== 'DAMAGE' || !(typeof action.ignoreDefense === 'boolean' ||
          (typeof action.ignoreDefense === 'number' && Number.isFinite(action.ignoreDefense) && action.ignoreDefense >= 0 && action.ignoreDefense <= 1)))) {
        throw new Error('ignoreDefense requires a DAMAGE action and a boolean or a number in [0, 1]');
      }
      if (action.partDamageMultiplier !== undefined &&
          (action.type !== 'DAMAGE' || !Number.isFinite(action.partDamageMultiplier) || action.partDamageMultiplier < 0)) {
        throw new Error('partDamageMultiplier requires a DAMAGE action and a finite nonnegative value');
      }
      if (action.uncounterable !== undefined &&
          (action.type !== 'DAMAGE' || typeof action.uncounterable !== 'boolean')) {
        throw new Error('uncounterable requires a DAMAGE action and a boolean');
      }
      if (action.uncritable !== undefined &&
          (action.type !== 'DAMAGE' || typeof action.uncritable !== 'boolean')) {
        throw new Error('uncritable requires a DAMAGE action and a boolean');
      }
      // 段落標籤只給傷害段：BUFF 段的標籤寫在各筆 buff 設定上，由 DOT 自己帶著走。
      if (action.hitOrder !== undefined && (action.type !== 'DAMAGE' || !['target', 'wave'].includes(action.hitOrder) ||
        (action.hitOrder === 'wave' && action.combo))) {
        throw new Error(`Skill "${id}" hitOrder must be 'target' or 'wave' on a DAMAGE action without combo.`);
      }
      if (action.tags !== undefined && action.type !== 'DAMAGE') {
        throw new Error('action tags require a DAMAGE action');
      }
      normalizeTags(action.tags, `Skill "${id}" action`);
    }
    this.id = id;
    this.name = name;
    this.tier = tier; // standard / ultimate，提供戰報呈現使用
    // 這招被當成 counterSkill 時的戰報呈現方式，見 docs/COUNTERS.md。
    this.counterStyle = counterStyle;
    // 整招不進入反擊判定（例如延遲引爆的陷阱），見 docs/COUNTERS.md。
    this.uncounterable = uncounterable;
    // 每一擊的被反擊機率倍率；1 維持原率，0 仍保留判定語意但不會成功。
    this.counterChanceMultiplier = counterChanceMultiplier;
    // 整招不會爆擊（例如法術），見 docs/MECHANICS.md。單一傷害段也可以各自寫 uncritable。
    this.uncritable = uncritable;
    // 自由標籤，框架不解讀，見 docs/TAGS.md。
    this.tags = normalizeTags(tags, `Skill "${id}"`);
    this.actions = actions; // 多段動作陣列
  }

  /**
   * 這招當普攻用時，是否真的會打出傷害段——也就是該不該收普攻的逐擊費用。
   *
   * 預設看 actions，這對資料驅動的技能是對的。但派發型普攻（自身 actions 為空，
   * execute 裡轉發給子技能）會被判成 false，於是整套體力機制對它靜靜失效：
   * 不收費、體力見底也不改為喘息，只會空轉掉一個行動槽。
   * 這種技能必須覆寫這個 getter 回 true。
   */
  get dealsBasicAttackDamage() {
    return this.actions.some(action => action.type === 'DAMAGE');
  }

  // 判斷是否能發動此技能 (看總體力消耗)
  canCast(entity, context, { ignoreSp = false, callChain = [] } = {}) {
    if (entity.actionDisabled || entity.isPanicked?.()) return false;
    const totalSpCost = this.actions.reduce((sum, action) => sum + (action.spCost || 0), 0);
    const basicCost = this === entity.normalAttack && this.dealsBasicAttackDamage
      ? entity.getBasicAttackCost() : 0;
    if (callChain.includes(this.id)) return false;
    return entity.stats.sp >= basicCost && (ignoreSp || entity.stats.sp >= totalSpCost + basicCost) && this.actions.every(action => {
      if (action.type === 'SUMMON') return context?.canSummon(entity, action);
      if (action.type === 'CAST_SKILL') {
        return (context?.getCastableSkills(entity, action.skillIds, [...callChain, this.id]).length || 0) > 0;
      }
      return true;
    });
  }

  // 增援實體由 BattleEngine 生成，日誌也在那邊寫，但文案仍走這裡的片段拼裝，
  // 技能才能用 text.action / text.summon 或 action.message 覆寫召喚台詞。
  summonMessage(action, caster, summoned) {
    return composeMessage(action, makeContext(this, caster,
      { target: summoned, targets: [summoned], hostile: summoned.summonHostile === true }));
  }

  // 工廠沒有可用增援時的那一行。沿用 SUMMON 的 action 前綴，只換後半段，
  // 這樣「X 召來了 Y！」與「X 沒有得到任何回應。」共用同一個開頭。
  // 目標不存在，所以 ctx.target 是 null——text.fail 不該去讀它。
  summonFailMessage(action, caster) {
    const ctx = makeContext(this, caster, {});
    if (action.failMessage) return action.failMessage(ctx);
    const text = { ...DefaultText.SUMMON, ...(action.text || {}) };
    return resolvePart(text.action, ctx) + resolvePart(text.fail, ctx);
  }

  // 選擇目標的輔助函式
  _selectTargets(targetType, caster, allies, enemies, { excludeSelf = false } = {}) {
    const aliveEnemies = enemies.filter(e => e.isAlive);
    // excludeSelf 只在被操控的反轉下開啟（見 BattleEngine.swapExcludesSelf）。
    // 隊上只剩自己時就沒有目標，這一段跳過，不會改打自己。
    const aliveAllies = allies.filter(e => e.isAlive && !(excludeSelf && e === caster));

    switch (targetType) {
      case 'ENEMY_SINGLE':
        if (aliveEnemies.length === 0) return [];
        // 仇恨值只作用在這裡。ALLY_SINGLE 維持均勻抽：仇恨的語意是「敵人想打誰」，
        // 拿它決定補師補誰會讓嘲諷坦克順便變成補血磁鐵，那是另一條權重。
        return [Formulas.pickByAggro(aliveEnemies)];
      case 'ENEMY_ALL':
        return aliveEnemies;
      case 'ALLY_SINGLE':
        if (aliveAllies.length === 0) return [];
        return [aliveAllies[Math.floor(random() * aliveAllies.length)]];
      case 'ALLY_ALL':
        return aliveAllies;
      case 'SELF':
        return [caster];
      default:
        return [];
    }
  }

  // 執行技能。回傳這一次施放的結果（CastReport，1.0.47），見 createCastReport。
  execute(caster, allies, enemies, logger, context, options = {}) {
    const report = createCastReport(this, caster);
    if (caster.actionDisabled || caster.isPanicked?.()) return finishCastReport(report);
    // Aggregate actual HP loss across every hit of this cast, separately per target.
    const receivedAttacks = new Map();
    const run = () => {
      // 出招前問一次敵方（BEFORE_SKILL_CAST，1.0.35），他們可以壓低這一招所有傷害段的傷害。
      const cast = context?.notifySkillCasting?.(caster, this);
      const castDamageMultiplier = cast?.damageMultiplier ?? 1;
      this._execute(caster, allies, enemies, logger, context,
        { ...options, receivedAttacks, castDamageMultiplier, report });
      for (const [target, hit] of receivedAttacks) {
        target.runDamagePassives('AFTER_ATTACK_RECEIVED', hit, logger, context);
        context?.settleDeaths();
        context?.checkWinCondition();
        // Attacker-side mirror of the same aggregate. Without it, "react once per
        // attack" was only expressible by the defender: an attacker passive had to
        // use the per-hit AFTER_DAMAGE_DEALT and re-derive the end of the attack
        // from hitIndex === hits, which silently miscounts multi-action skills
        // (each action restarts the index) and forces every consumer to rebuild
        // the aggregation the framework already did here.
        // Ordering follows finishDamage: the receiver reacts before the dealer.
        if (!caster.isAlive) continue;
        caster.runDamagePassives('AFTER_ATTACK_DEALT', hit, logger, context);
        context?.settleDeaths();
        context?.checkWinCondition();
      }
      context?.notifySkillCast?.(caster, this);
      return finishCastReport(report);
    };
    return context ? context.withSkill(caster, this, run) : run();
  }

  _execute(caster, allies, enemies, logger, context, options) {
    let currentTargets = [];
    let forcedTargets = options.targets;
    const damagedTargets = new Set();
    if (context?.counterSource) {
      const parentLogger = logger;
      const source = { ...context.counterSource };
      logger = { addLog: entry => parentLogger.addLog({ ...entry, isCounter: true, counterSource: source }) };
    }

    for (const action of this.actions) {
      if (!caster.isAlive || caster.isPanicked?.() || context?.result) break;
      if (action.type === 'SUMMON' && !context?.canSummon(caster, action)) continue;
      // 1. 扣除該段 SP
      const cost = options.ignoreSp ? 0 : action.spCost || 0;
      if (caster.stats.sp < cost) {
        break; // 體力不足以執行後續段落，中斷
      }
      if (caster.spendSp) caster.spendSp(cost, logger);
      else caster.stats.sp -= cost; // Legacy plain-object skill callers.
      if (action.type === 'CAST_SKILL') {
        if (!context) throw new Error(`CAST_SKILL in "${this.id}" requires a BattleEngine context.`);
        // 子技能是獨立的一招，不繼承普攻的逐擊費用——這跟 AFTER_ATTACK_RECEIVED
        // 把 CAST_SKILL 分開計算是同一條界線（見 docs/INANIMATE.md）。
        // 派發型普攻是直接呼叫子技能的 execute，不走這裡，所以仍然收得到。
        const slot = caster.inBasicAttackSlot;
        caster.inBasicAttackSlot = false;
        try { context.castSkill(caster, action.skillIds); }
        finally { caster.inBasicAttackSlot = slot; }
        continue;
      }
      if (action.type === 'SUMMON') {
        context.summon(caster, action, this);
        continue;
      }

      // 2. 決定目標 (是否延續上一段的目標)
      const inherit = action.inheritTarget !== false;
      const baseTargetType = action.targetType || 'ENEMY_SINGLE';
      // 沒寫 targetType 的 TEXT 只是扣 SP、印開場白，不算「挑目標」，不觸發延後的目標判定。
      const settles = action.type !== 'TEXT' || action.targetType !== undefined;
      const pending = context?.actionTargetOverride?.pending === true && context.actionTargetOverride.caster === caster;
      const targetType = context?.resolveActionTargetType
        ? context.resolveActionTargetType(caster, baseTargetType, { settle: settles })
        : baseTargetType;
      const swappedSides = targetType !== baseTargetType;
      // 反轉下的指定目標：透過 engine.targetPool／selectTargets 挑的已經站在反轉後那一邊，照用；
      // 直接從 enemies 挑的會打錯邊，作廢後照反轉後的 targetType 重抽（1.0.41 之前一律作廢）。
      const forcedFollows = !swappedSides || Boolean(forcedTargets &&
        context?.forcedTargetsFollowSwap?.(caster, baseTargetType, forcedTargets));
      // 嚴格模式（strictTargeting，1.0.47）：不靜默重抽，直接拋錯。重抽讓傷害照樣打得出去、戰報也正常，
      // 但呼叫端還以為打的是自己挑的那個人，後面的附帶效果就會掛錯人（打了自己，昏迷卻落在對面）。
      if (action.type === 'DAMAGE' && forcedTargets && !forcedFollows && context?.strictTargeting) {
        throw new Error(`Skill "${this.id}": options.targets were picked from the original side, but this cast is ` +
          'side-swapped (confusion or control). Pick them with engine.targetPool() or engine.selectTargets() ' +
          'so they follow the swap. (strictTargeting)');
      }
      if (action.type === 'DAMAGE' && forcedTargets && forcedFollows) {
        currentTargets = forcedTargets.filter(target => target.isAlive);
        forcedTargets = null;
      } else if (!inherit || currentTargets.length === 0 || (pending && swappedSides)) {
        // 第三個條件：反轉是這一段才判定出來的，前面沒寫 targetType 的 TEXT 抓到的還是反轉前那一邊，不能延續。
        // 不延續，或是目前還沒有目標，就依照本段（可能經敵我反轉）的 targetType 抓取。
        currentTargets = this._selectTargets(targetType, caster, allies, enemies,
          { excludeSelf: swappedSides && Boolean(context?.swapExcludesSelf?.(caster)) });
      }
      // A legacy fixed-target redirect replaces hostile damage targets after ordinary and
      // explicitly-forced targeting. Side swaps were already applied to targetType above.
      if (action.type === 'DAMAGE' && context?.resolveActionTargets) {
        currentTargets = context.resolveActionTargets(caster, action, currentTargets);
      }

      // 如果本段依然找不到目標，就跳過本段效果
      if (currentTargets.length === 0) continue;

      // 3. 執行本段效果
      if (action.type === 'TEXT') {
        logger.addLog({
          type: 'SKILL_TEXT',
          actorId: caster.id,
          skillId: this.id,
          skillTier: this.tier,
          isNormalAttack: this === caster.normalAttack,
          // 帶上 targets 讓文字可以根據目標改變；單一目標的場合 target 也一併給
          message: composeMessage(
            action,
            makeContext(this, caster, {
              targets: currentTargets,
              target: currentTargets[0] || null
            })
          )
        });
        continue;
      }

      // 一擊的完整判定（扣費、命中、反擊、傷害、日誌）。回傳 false 代表這個目標的後續段數不必再打。
      // isComboHit 決定開頭用 combo 還是 action 片段：逐波順序下每個目標在每一波都是第一行。
      const strikeOnce = (target, i, hits, isNormalAttack, tags, isComboHit) => {
        if (!target.isAlive || !caster.isAlive || caster.isPanicked?.() || context?.result) return false;
        // Pay for the attempt, including misses and attacks intercepted by counters.
        if (isNormalAttack && !caster.spendSp(caster.getBasicAttackCost(), logger)) return false;

        const hitIndex = i + 1;
        const record = castEntry(options.report, target);
        if (record) record.attempts++;

        // A successful counter has already won its reaction check, so its reply cannot miss.
        const rolls = !context?.counterSource && !action.ignoreInvincible;
        // 打不到的目標不擲骰：沒有 untouchable 的戰鬥 RNG 序列一步都不會變。
        const untouchable = rolls ? target.buffs.find(buff => buff.untouchable) || null : null;
        const hitRoll = untouchable ? { hit: false }
          : rolls ? (context?.resolveHit?.(caster, target, this, action, hitIndex)
            || { hit: Formulas.isHit(caster, target, action.accuracy || 1) })
          : { hit: true };
        if (!hitRoll.hit) {
          // 落空先問防守方「你是怎麼躲的」，再組句；不答就維持原本的預設文案。
          const evasion = target.resolveEvasion(
            { caster, skill: this, action, hitIndex, hits, isNormalAttack, tags, untouchable,
              forcedMiss: hitRoll.forced === true });
          logger.addLog({
            type: 'MISS',
            actorId: caster.id,
      skillId: this.id,
      skillTier: this.tier,
      isNormalAttack,
            targetId: target.id,
            ...(evasion.evadeMethod ? { evadeMethod: evasion.evadeMethod } : {}),
            // 防守方的整句覆寫排在攻擊方 action.message 之前：閃避方式是只有
            // 防守方知道的事，攻擊方的技能文案寫不出「對手是怎麼躲掉的」。
            message: hitRoll.evadeMessage || evasion.evadeMessage || composeMessage(
              action,
              makeContext(this, caster, { target, targets: [target], hitIndex, evadeMethod: evasion.evadeMethod }),
              { isComboHit, isHitLanded: false }
            )
          });
          if (record) record.missed++;
          // 反應側排在 MISS 之後：先讓戰報說「躲掉了」，後果才接在下一行。
          target.runEvadeReactions(evasion, logger, context);
          return true;
        }

        if (hitRoll.hitMessage) logger.addLog({ type: 'BOSS_DIALOGUE',
          actorId: target.id, skillId: this.id, message: hitRoll.hitMessage });

        // 每一擊各自判定：多段技能挨的刀多，給對手的機會就該多。
        if (context?.tryCounter(caster, target, this,
          { action, hitIndex, isComboHit })) {
          if (record) record.countered++;
          return true;
        }

        // uncritable 在擲骰之前就排除（與 uncounterable 同一套做法）：不是把爆擊率壓低，
        // 所以 Buff 把 cri 加到 100% 也蓋不掉；沒用到的技能照常擲骰，亂數序列不變。
        const isCrit = (this.uncritable || action.uncritable === true) ? false : Formulas.isCritical(caster);
        // 傷害預設依賴 atk；action.stat 可讓法術等技能改用 int 或其他能力。
        // Formulas 會在欄位不存在時直接拋錯，避免拼錯後悄悄打成最低傷害。
        let damage = Formulas.calculateDamage(caster, target, action.power || 1, action.stat || 'atk',
          { ignoreDefense: action.ignoreDefense ?? false });
        
        // 如果是普攻或指定連擊，後續打擊傷害遞減 (預設改為 40% 懲罰，避免敏捷過強)
        if ((isNormalAttack || action.combo) && i > 0) {
          const decay = action.damageDecay !== undefined ? action.damageDecay : 0.4;
          damage = Math.max(1, Math.floor(damage * Math.pow(1 - decay, i)));
        }

        if (isCrit) {
          damage = Math.floor(damage * Formulas.getCriticalMultiplier(caster));
        }

        if (action.damageMultiplier !== undefined) damage = Math.floor(damage * action.damageMultiplier);
        if (options.castDamageMultiplier !== undefined && options.castDamageMultiplier !== 1) {
          damage = Math.floor(damage * options.castDamageMultiplier);
        }
        const outcome = target.takeDamage(damage, logger, {
          caster, skill: this, action, hitIndex, hits, isCrit, isNormalAttack, tags,
          isCounter: !!context?.counterSource, deferReactions: true
        });
        // 被護盾吃掉的也算打中（1.0.38）：攻擊確實落在對方身上，只是血沒少。
        if ((outcome.actualDamage > 0 || outcome.shieldAbsorbed > 0) && !outcome.isCounter && caster.team !== target.team) {
          const summary = options.receivedAttacks.get(target) || { ...outcome, actualDamage: 0, shieldAbsorbed: 0 };
          summary.actualDamage += outcome.actualDamage;
          summary.shieldAbsorbed += outcome.shieldAbsorbed || 0;
          options.receivedAttacks.set(target, summary);
        }
        damage = outcome.damage;
        if (damage > 0) damagedTargets.add(target);
        if (record) {
          record.landed++;
          if (outcome.blocked) record.blocked++;
          if (isCrit) record.crits++;
          record.damage += damage;
          record.actualDamage += outcome.actualDamage || 0;
          record.shieldAbsorbed += outcome.shieldAbsorbed || 0;
        }

        logger.addLog({
          type: outcome.blocked ? 'BLOCK' : 'DAMAGE',
          actorId: caster.id,
      skillId: this.id,
      skillTier: this.tier,
      isNormalAttack,
          targetId: target.id,
          value: damage,
          actualDamage: outcome.actualDamage,
          ...(outcome.partId ? { partId: outcome.partId, partName: outcome.partName,
            partDamage: outcome.partDamage || 0, partDurability: outcome.partDurability } : {}),
          isCrit,
          blocked: outcome.blocked,
          ...(outcome.shieldAbsorbed ? { shieldAbsorbed: outcome.shieldAbsorbed } : {}),
          message: (() => {
            const messageContext = makeContext(this, caster, { target, targets: [target], value: damage, isCrit, hitIndex,
              blocked: outcome.blocked, blockMethod: outcome.blockMethod,
              partId: outcome.partId, partName: outcome.partName, partDamage: outcome.partDamage });
            // 防守方的整句格擋（1.0.52）：「是誰、怎麼擋下的」只有防守方知道，所以跟 evadeMessage 一樣
            // 蓋過攻擊方的 action.message。沒設時照舊組句，既有戰報一字不變。
            if (outcome.blocked && outcome.blockMessage != null) {
              return resolveBlockMessage(outcome.blockMessage, { ...messageContext,
                lead: Skill.composeLead(this, action, caster, target, { hitIndex, isComboHit }) });
            }
            return composeMessage(action, messageContext, { isComboHit, isHitLanded: true });
          })()
        });
        target.finishDamage(outcome, logger, context);
        return true;
      };

      // 逐波（hitOrder: 'wave'，1.0.31）：多段的全體攻擊一段打完所有目標才換下一段，
      // 第 2 段起先印 text.wave 當過場。固定段數才有「一波」可言，普攻與速度連擊照舊逐目標打完。
      const isWaveDamage = action.type === 'DAMAGE' && action.hitOrder === 'wave' && !options.basicCounter
        && this !== caster.normalAttack && caster.inBasicAttackSlot !== true;
      if (isWaveDamage) {
        const hits = action.hits || 1;
        const tags = mergeTags(this.tags, normalizeTags(action.tags, `Skill "${this.id}" action`));
        const done = new Set();
        for (let i = 0; i < hits; i++) {
          if (!caster.isAlive || caster.isPanicked?.() || context?.result) break;
          const wave = currentTargets.filter(target => target.isAlive && !done.has(target));
          if (!wave.length) break;
          if (i > 0 && action.text?.wave !== undefined) {
            const message = resolvePart(action.text.wave,
              makeContext(this, caster, { targets: wave, target: wave[0], hitIndex: i + 1 }));
            if (message) logger.addLog({ type: 'SKILL_TEXT', actorId: caster.id, skillId: this.id,
              skillTier: this.tier, isNormalAttack: false, message });
          }
          for (const target of wave) {
            if (!strikeOnce(target, i, hits, false, tags, false)) done.add(target);
          }
        }
        continue;
      }

      currentTargets.forEach(target => {
        if (!target.isAlive || !caster.isAlive || caster.isPanicked?.() || context?.result) return;
        if (action.requiresDamage && !damagedTargets.has(target)) return;

        if (action.type === 'DAMAGE') {
          // inBasicAttackSlot 讓派發型普攻轉發出去的子技能也照樣逐擊收費：
          // 子技能的 this 不是 caster.normalAttack，只比對 this 會整套漏收。
          const isNormalAttack = options.basicCounter
            || this === caster.normalAttack || caster.inBasicAttackSlot === true;
          let hits = action.hits || 1;
          const tags = mergeTags(this.tags, normalizeTags(action.tags, `Skill "${this.id}" action`));
          
          if (!options.basicCounter && (isNormalAttack || action.combo)) {
            hits = Formulas.getCombos(caster, target);
          }

          for (let i = 0; i < hits; i++) {
            if (!strikeOnce(target, i, hits, isNormalAttack, tags, hits > 1 && i > 0)) break;
          }
        } 
        else if (action.type === 'HEAL') {
          // 回復量預設綁施放者的 atk，action.stat 可以改綁任何一項能力值
          // （例如綁 int，讓輔助型角色的養成方向跟輸出型分開）。
          // 拼錯字若靜默退回 atk 或回 0，會變成「這招好像沒什麼用」這種
          // 得盯著戰報算數字才發現的問題，所以直接擋掉。
          // action.stat 也可以是 { atk: 1, int: 1 } 這種權重表：回復量同時吃好幾項能力值，
          // 讓「打得動的補師」不必在輸出與回復之間二選一（最終值 = Σ 能力值 × 權重 × power）。
          const weights = typeof action.stat === 'object' && action.stat !== null
            ? action.stat : { [action.stat || 'atk']: 1 };
          let scale = 0;
          for (const [statKey, weight] of Object.entries(weights)) {
            if (typeof caster.stats[statKey] !== 'number') {
              throw new Error(`HEAL action of skill "${this.id}" references unknown caster stat "${statKey}".`);
            }
            if (!Number.isFinite(weight)) {
              throw new Error(`HEAL action of skill "${this.id}" has a non-numeric weight for stat "${statKey}".`);
            }
            scale += caster.stats[statKey] * weight;
          }
          // 讀的是原始 stats 而不是生效值，所以同一次施放中前面幾段的 buff
          // 放大不了這裡的回復量，兩段的先後順序沒有差別。
          const healAmount = target.heal(Math.floor(scale * (action.power || 1)), logger, { deferReactions: true });
          // 群體治療（1.0.44）：滿血或回不到血的目標不印「恢復了 0」。二十人的隊伍一次全體治療，
          // 光是滿血的人就能洗掉半面戰報。單體治療照印，否則看不出施放者這一動做了什麼。
          if (healAmount === 0 && currentTargets.length > 1) {
            target.checkPassives('ON_HP_CHANGE', logger, context);
            return;
          }
          logger.addLog({
            type: 'HEAL',
            actorId: caster.id,
          skillId: this.id,
          skillTier: this.tier,
          isNormalAttack: this === caster.normalAttack,
            targetId: target.id,
            value: healAmount,
            message: composeMessage(
              action,
              makeContext(this, caster, { target, targets: [target], value: healAmount })
            )
          });
          target.checkPassives('ON_HP_CHANGE', logger, context);
        }
        else if (action.type === 'CHANGE_SANITY') {
          target.changeSanity(action.amount, logger, { engine: context, caster, skill: this, source: 'SKILL',
            message: event => composeMessage(action, makeContext(this, caster,
              { ...event, target, targets: [target] })) });
        }
        else if (action.type === 'RESTORE_SP') {
          const value = target.restoreSp(action.amount || 0);
          logger.addLog({ type: 'SP_RECOVER', actorId: caster.id, targetId: target.id,
            skillId: this.id, skillTier: this.tier, isNormalAttack: this === caster.normalAttack,
            value, message: composeMessage(
              action,
              makeContext(this, caster, { target, targets: [target], value })
            ) });
          target.syncFatigue(logger);
        }
        else if (action.type === 'BUFF') {
          const buffs = action.buffs || [];
          buffs.forEach(buffConfig => {
            // 被拒收（addBuff 回傳 false）就不印施加句，免得戰報一邊說擋下一邊說中了。
            if (target.addBuff(buffConfig, context) === false) return;
            logger.addLog({
              type: 'BUFF_APPLY',
              actorId: caster.id,
          skillId: this.id,
          skillTier: this.tier,
          isNormalAttack: this === caster.normalAttack,
              targetId: target.id,
              message: composeMessage(
                action,
                makeContext(this, caster, { target, targets: [target], buff: buffConfig })
              )
            });
          });
        }
      });
    }
  }
}

/**
 * 只拼出 DAMAGE 那行的開頭（lead），給 BattleEngine 組反擊訊息用。
 *
 * 反擊取代的是「原本該擊的傷害行」，所以 COUNTER 的開頭必須跟那行一字不差：
 * 單段技能的開頭是「A 使出了 技能名，」，濃縮成一行剛好；多段技能的開頭是
 * 「第 N 擊，」，技能名早就由前面那行獨立宣告過了。引擎自己造句的話，多段技能
 * 就會宣告一次、反擊再複述一次。
 */
Skill.composeLead = function (skill, action, caster, target, { hitIndex = 1, isComboHit = false } = {}) {
  // 整句覆寫的技能沒有可用的片段，退回敘述式開頭。
  if (action.message) return `${caster.name} 使出了 ${skill.name}，`;
  const text = { ...DefaultText[action.type], ...(action.text || {}) };
  const ctx = makeContext(skill, caster, { target, targets: [target], hitIndex });
  return resolvePart(isComboHit ? text.combo : text.action, ctx);
};

module.exports = Skill;

},

"src/utils/BattleNames.js": function (module, exports, require) {
// Remember only names assigned by the engine, so reusing an Entity in another
// battle does not turn an automatic suffix into part of its original name.
const assignedNames = new WeakMap();

function assignBattleNames(entities) {
  const originals = entities.map(entity => {
    const previous = assignedNames.get(entity);
    return previous && entity.name === previous.assigned ? previous.original : entity.name;
  });
  const reserved = new Set(originals);
  const used = new Set();
  const nextNumbers = new Map();

  entities.forEach((entity, index) => {
    const original = originals[index];
    if (typeof original !== 'string' || !original) return;
    let name = original;
    if (used.has(name)) {
      let number = nextNumbers.get(original) || 2;
      // Preserve literal names such as "桐人2" instead of assigning the same
      // name to a duplicate "桐人" earlier in the roster.
      do { name = `${original}${number++}`; } while (reserved.has(name) || used.has(name));
      nextNumbers.set(original, number);
    }
    used.add(name);
    entity.name = name;
    assignedNames.set(entity, { original, assigned: name });
  });
}

module.exports = assignBattleNames;

},
"src/utils/Formulas.js": function (module, exports, require) {
const { random } = require('./Random');
/**
 * 取得「加成後」的能力值。
 *
 * 所有公式都必須走這裡，不要直接讀 entity.stats——type:'STAT' 的 buff 只作用在
 * getEffectiveStats() 回傳的副本上，直接讀原始 stats 會讓那類 buff 靜默失效
 * （戰報照常印出「被附加了 X 狀態」，數值卻完全沒變）。
 *
 * 這是唯讀路徑，回傳的是副本、寫入無效。
 * 扣血一律走 Entity.takeDamage，它寫的是原始 stats.hp。
 *
 * 對沒有這個方法的物件（例如單元測試的樁）退回原始 stats，
 * 讓公式仍然可以脫離 Entity 單獨測試。
 */
const statsOf = (entity) =>
  typeof entity.getEffectiveStats === 'function' ? entity.getEffectiveStats() : entity.stats;

// 每回合的行動槽數 = 存活人數 × 這個倍率。
//
// 這顆旋鈕調的是「行動的顆粒度」，不是總行動量：倍率 2 會讓回合數大致減半
// （實測 1v1 從 27 回合變 14），整場的總行動槽維持在 54~56 不變。
// 所以以行動槽計時的東西——Buff 的 duration、DOT/HOT 的 onPreTurn、tickBuffs、
// SP 預算——佔整場的比例都不受影響，調這個值不需要跟著改技能數值。
// 真正會被影響的是綁「回合」的機制，目前只有 trigger: 'ROUND_START' 那類 Buff：
// 它每回合觸發一次，回合數減半就等於總觸發次數減半。
//
// 從 1 調到 2 的實際效果是壓低變異數。倍率 1 時慢速單位有 29~38% 的機率
// 整個回合一次都沒被抽到，倍率 2 降到 1% 以下——抽中就砍速度 3/4 的衰減有上限，
// 快的人連抽第三、四次時權重已所剩無幾，多出來的槽會落到還沒動過的人身上。
// 慢速單位的槽位佔比因此從 36.6% 升到 41.7%。
const ACTION_SLOTS_PER_ENTITY = 2;

// 連擊門檻：速度差每累積這麼多點，連擊數的下限／上限才各加一。
// 數字越大越難連擊，這是壓制高速角色的主要旋鈕。
//
// 從 40/15 調到 100/40 的理由：在玩家養成上限很高的遊戲裡，滿等玩家 spd 可達 200~500，
// 而怪物最高只有 100，速度差常態超過 300，換算成一次普攻 8~22 連擊。
// 連擊本身對傷害影響不大（普攻有 40% 遞減，總倍率收斂在 2.5 倍），
// 但每一下都是一行戰報、一次命中判定、一次爆擊判定與一次反擊判定，
// 所以真正被放大的是戰報長度與觸發型機制的觸發次數。
const COMBO_GAP_PER_MIN_HIT = 100;
const COMBO_GAP_PER_MAX_HIT = 40;

/**
 * 反擊：`stats.counter` 是「反擊點數」，不是機率。
 *
 * 機率只看攻守雙方的點數差，跟幸運事件看 luk 差、連擊看 spd 差同型；點數怎麼從
 * 遊戲的能力值換算由遊戲層決定（對照 hit / eva 的作法），框架只負責這條曲線。
 *
 * 曲線是 S 型而不是 max(0, 差值)：落後的一方機率遞減但不歸零，技巧輸人只是
 * 比較難反擊，不是完全反擊不了。截斷成零的版本會讓「數值較低的那一側」整個
 * 失去這個機制——例如數值通常輸給玩家的 Boss，反擊招牌技會全部變成死內容。
 *
 *   點數相同      → 上限的一半
 *   落後 GAP_SCALE → 約上限的 27%
 *   領先 GAP_SCALE → 約上限的 73%
 *
 * GAP_SCALE 決定技巧差多敏感（越小越懸殊），CEILING 是機率上限：反擊必定命中
 * 又會跳過原本那一擊的傷害，逼近 100% 等於高點數單位完全免疫低點數單位。
 * 目前 0.2：點數相同 10%，差 ±50 約 14.6% / 5.4%。原本 0.3（相同時 15%）在每擊
 * 各判定一次之下反擊還是太頻繁，整條曲線等比例壓低，形狀不變。
 */
const COUNTER_CEILING = 0.2;
const COUNTER_GAP_SCALE = 50;

class Formulas {
  static luckEventProfile(actor, opponent) {
    const gap = Math.max(0, (statsOf(opponent).luk ?? 0) - (statsOf(actor).luk ?? 0));
    const ratio = gap / (gap + 100);
    return { gap, ratio, purpleChance: 0.30 * ratio, redChance: 0.10 * ratio,
      // Raw damage before variance and the universal softenLuckDamage curve.
      purpleDamage: gap * 1.2,
      redDamage: gap * 2.4 };
  }

  // Shared by normal and luck damage: vary before rounding, minimum 1.
  static applyDamageVariance(baseDamage) {
    return Math.max(1, Math.floor(baseDamage * (0.9 + random() * 0.2)));
  }

  // All luck events, regardless of team, character, monster or game mode.
  // Apply after variance, preserving the random stream and small accidents.
  static softenLuckDamage(damage, tier) {
    const multiplier = tier === 'RED' ? 2.4 : 1.2;
    const gap = damage / multiplier;
    const knee = 200;
    if (gap <= knee) return damage;
    return Math.floor(multiplier * (knee + knee * Math.log1p((gap - knee) / knee)));
  }

  static rollLuckEvent(profile, roll = random()) {
    if (roll < profile.redChance) return 'RED';
    if (roll < profile.redChance + profile.purpleChance) return 'PURPLE';
    return null;
  }

  static counterChance(attacker, defender) {
    // 0 點視為「這個單位不參與反擊」，而不是「技巧最低的單位」——
    // 沒設定過 counter 的實體（多數召喚物、測試樁）不該因為差值曲線憑空獲得反擊。
    const points = statsOf(defender).counter || 0;
    if (points <= 0) return 0;
    const gap = points - (statsOf(attacker).counter || 0);
    return COUNTER_CEILING / (1 + Math.exp(-gap / COUNTER_GAP_SCALE));
  }

  static isCounter(attacker, defender, chanceMultiplier = 1, roll = random()) {
    const chance = Formulas.counterChance(attacker, defender) * chanceMultiplier;
    return chance > 0 && roll < chance;
  }
  // 決定行動順序，這裡採用基於速度的權重抽籤
  static determineActionOrder(entities) {
    const aliveEntities = [...entities].filter(e => e.isAlive);
    const spds = aliveEntities.map(e => Math.max(1, statsOf(e).spd));
    let sum = spds.reduce((a, b) => a + b, 0);
    const order = [];

    // 每個回合有 [參戰人數 × ACTION_SLOTS_PER_ENTITY] 個行動槽
    const slots = aliveEntities.length * ACTION_SLOTS_PER_ENTITY;
    for (let i = 0; i < slots; i++) {
      let roll = Math.floor(random() * sum);
      for (let j = 0; j < spds.length; j++) {
        if (roll < spds[j]) {
          order.push(aliveEntities[j]);
          // 抽中的人行動速度暫時減少 3/4
          const reduction = Math.floor(spds[j] * (3 / 4));
          spds[j] -= reduction;
          sum -= reduction;
          break;
        }
        roll -= spds[j];
      }
    }

    return order;
  }

  /**
   * 單體技能要打誰：以仇恨值為權重抽一個目標。
   *
   * 呼叫端只保證候選人都還活著，權重一律現算，所以嘲諷／隱蔽這類 type:'STAT'
   * 的 buff 一掛上就生效、一過期就還原，不需要任何人維護一張仇恨表。
   * 刻度是倍率：aggro 2 的人被抽中的機率是 aggro 1 的兩倍。
   *
   * 兩個刻意的性質：
   * - 權重全等時，這裡選到的索引就是 floor(random × n)，跟改用權重之前那行
   *   均勻抽完全一致，而且同樣只消耗一次亂數。既有的戰鬥（與任何固定亂數的
   *   測試）因此一字不變。
   * - 全場權重都是 0（全員隱蔽、或 lockedStats 鎖掉 aggro）時退回均勻抽。
   *   否則單體技能會找不到目標，雙方互相打不到，戰鬥只能卡到 maxTurns。
   */
  static pickByAggro(candidates) {
    // 只剩一個候選人時也要照常擲骰。舊的均勻抽在這裡一樣會擲一次骰，
    // 省掉它會讓 1v1 整場的亂數序列位移——所有固定亂數的戰鬥都會變成另一場。
    const weights = candidates.map(entity => Math.max(0, statsOf(entity).aggro ?? 1));
    const sum = weights.reduce((a, b) => a + b, 0);
    if (sum <= 0) return candidates[Math.floor(random() * candidates.length)];
    let roll = random() * sum;
    for (let i = 0; i < candidates.length; i++) {
      if (roll < weights[i]) return candidates[i];
      roll -= weights[i];
    }
    return candidates[candidates.length - 1]; // 浮點誤差的收尾
  }

  // 傷害公式 (使用漸進式減傷)
  // ignoreDefense（1.0.58）：true 無視全部防禦，0～1 的數字是無視那一比例——防禦先乘上 (1 - 比例) 再進公式。
  //   0.4 就是「用 60% 的防禦計算」，仍走原本漸進式的減傷曲線，所以高防禦目標不會被補償過頭。
  static calculateDamage(attacker, defender, skillPower = 1, statKey = 'atk', { ignoreDefense = false } = {}) {
    const scale = statsOf(attacker)[statKey];
    if (typeof scale !== 'number') {
      throw new Error(`Damage formula references unknown attacker stat "${statKey}".`);
    }
    // 確保防禦不小於 0 (如果未來有破甲負防禦機制，可以修改這裡)
    const pierce = ignoreDefense === true ? 1 : (ignoreDefense === false ? 0 : ignoreDefense);
    if (!Number.isFinite(pierce) || pierce < 0 || pierce > 1) {
      throw new Error('ignoreDefense must be a boolean or a number in [0, 1].');
    }
    // 沒用到時 pierce 是 0，乘 1 不改變數值，傷害與亂數序列都和以前一樣。
    const def = Math.max(0, statsOf(defender).def || 0) * (1 - pierce);
    
    // 防禦常數 (當 def 等於這個常數時，減傷 50%)
    const EHP_C = 300; 

    // 減傷乘數
    const damageMultiplier = EHP_C / (def + EHP_C);

    // 基礎傷害 = (指定攻擊能力 * 技能倍率) * 減傷乘數。
    // 預設仍是 atk；法術等技能可明確指定 int，不影響既有技能。
    const baseDamage = scale * skillPower * damageMultiplier;
    
    // 加入 ±10% 的隨機浮動 (0.9 ~ 1.1)
    return Formulas.applyDamageVariance(baseDamage);
  }

  // 計算連擊次數 (根據速度差)
  static getCombos(attacker, defender) {
    const gap = Math.max(0, statsOf(attacker).spd - statsOf(defender).spd);
    const minC = Math.max(1, Math.ceil(gap / COMBO_GAP_PER_MIN_HIT));
    const maxC = Math.max(1, Math.ceil(gap / COMBO_GAP_PER_MAX_HIT));
    return Math.floor(random() * (maxC - minC + 1)) + minC;
  }

  // 爆擊判定
  static isCritical(attacker) {
    return random() < (statsOf(attacker).cri || 0);
  }

  // 爆擊傷害倍率 (預設 1.5 倍)
  static getCriticalMultiplier(attacker) {
    return statsOf(attacker).criDmg || 1.5;
  }

  // 命中判定
  // 對抗式命中的閃避機率（1.0.59，hitFormula: 'contest'）。
  // 命中 = CONTEST_BASE_HIT + hit 屬性，差距 = 閃避 − 命中：
  //   閃避機率 = (100 + max(0, 差距)) / (200 + |差距|)
  // 以 50% 為中心對稱（差距 +X 與 −X 的閃避機率相加 = 1），兩端只會逼近 0% 與 100%。
  // 為什麼要有這一套：classic 公式裡命中只能抵銷閃避，對方閃避 0 時命中完全沒有作用；
  // 這裡命中與閃避任何時候都有效果，只是越往兩端越平緩。初始命中 200、閃避 0 時有 25% 打空。
  static contestEvadeChance(hitStat = 0, evaStat = 0) {
    const hit = Formulas.CONTEST_BASE_HIT + Math.max(0, hitStat || 0);
    const gap = Math.max(0, evaStat || 0) - hit;
    return (100 + Math.max(0, gap)) / (200 + Math.abs(gap));
  }

  // formula：'classic'（預設，原本的公式）或 'contest'（見上）。由 BattleEngine 的 hitFormula 選項帶入。
  // 兩種都只擲一次骰，所以換公式不會讓之後的亂數錯位；沒開 contest 時結果與亂數序列和舊版相同。
  static isHit(attacker, defender, skillAccuracy = 1, hitRateModifier = 0, formula = 'classic') {
    const hitStat = Math.max(0, statsOf(attacker).hit || 0);
    const evaStat = Math.max(0, statsOf(defender).eva || 0);

    if (formula === 'contest') {
      // 技能命中修正（accuracy）乘在命中率上；hitRateModifier（hitResolver）照舊加減；保底 10%、上限 100%。
      const rate = (1 - Formulas.contestEvadeChance(hitStat, evaStat)) * skillAccuracy + hitRateModifier;
      return random() < Math.min(1.0, Math.max(0.1, rate));
    }
    if (formula !== 'classic') throw new Error(`hitFormula must be 'classic' or 'contest', got "${formula}".`);

    // 漸進式閃避計算：閃避值越高，實際閃避機率的成長越平緩 (以 100 為基準點)
    // 例如：eva = 100 -> 50% 閃避 | eva = 300 -> 75% 閃避
    const evadeChance = evaStat / (evaStat + 100);

    // 命中率加成：每 1 點 hit 提供 1% 額外命中
    const hitBonus = hitStat / 100;

    let finalHitRate = skillAccuracy + hitBonus - evadeChance + hitRateModifier;

    // 保底命中率 10% (0.1)，確保不會出現「完全閃避」的情況
    finalHitRate = Math.max(0.1, finalHitRate);

    // 最高命中率 100% (1.0)
    finalHitRate = Math.min(1.0, finalHitRate);

    return random() < finalHitRate;
  }
}

// 對抗式命中（hitFormula: 'contest'）的初始命中：hit 屬性加在它上面。
Formulas.CONTEST_BASE_HIT = 200;

module.exports = Formulas;

},

"src/utils/Random.js": function (module, exports, require) {
// 框架裡所有擲骰都經過 random()。
//
// 預設每次都去呼叫「當下的」Math.random，而不是在載入時把它存起來：
// 測試裡替換 Math.random 的寫法照常有效，沒有指定 rng 的戰鬥亂數序列也和舊版完全相同。
//
// BattleEngine 的 rng 選項只在 start() 執行期間換掉來源，跑完（含拋錯）就換回來。
// 戰鬥是同步一次跑完的，所以不會有兩場戰鬥同時共用來源的問題。
// 沒有指定 rng 的引擎沿用當下的來源：在某場戰鬥的鉤子裡再開一場，會跟著外層的種子走。
const defaultSource = () => Math.random();
let source = defaultSource;

function random() {
  return source();
}

function withRandom(rng, run) {
  if (rng == null) return run();
  if (typeof rng !== 'function') throw new Error('rng must be a function returning a number in [0, 1)');
  const previous = source;
  source = rng;
  try {
    return run();
  } finally {
    source = previous;
  }
}

// 可重現的亂數（mulberry32）：同一個整數種子永遠產生同一串數字。
// 給重播、平衡模擬與回歸測試用，不適合任何需要安全性的場合。
function createSeededRandom(seed) {
  if (!Number.isSafeInteger(seed)) throw new Error('seed must be a safe integer');
  let state = seed >>> 0;
  return () => {
    state = (state + 0x6D2B79F5) >>> 0;
    let t = state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

module.exports = { random, withRandom, createSeededRandom };

},
"src/utils/Tags.js": function (module, exports, require) {
/**
 * 標籤（tags）：技能、單一 action 與 Buff 上的自由字串，框架只負責驗證與傳遞，不解讀。
 *
 * 「火會燒營」「水會被泥偶吸收」這類規則屬於遊戲，框架不內建屬性表、也不做相剋。
 * 傷害結算時，攻擊的標籤＝技能標籤 ∪ 該段 action 標籤；DOT 的標籤＝該 Buff 的標籤。
 * 合併後放在 hit.tags，所有傷害側的觸發器（BEFORE_DAMAGE、AFTER_DAMAGE_RECEIVED……）
 * 都讀得到。沒有標籤時是空陣列，不是 undefined，讀取端不必判空。
 */
const EMPTY = Object.freeze([]);

function normalizeTags(tags, label) {
  if (tags === undefined) return EMPTY;
  // 打錯型別若安靜地變成「沒有標籤」，只會看到「這招怎麼沒觸發」，跟機率沒中長得一樣。
  if (!Array.isArray(tags) || tags.some(tag => typeof tag !== 'string' || !tag)) {
    throw new Error(`${label} tags must be an array of non-empty strings.`);
  }
  return tags.length ? Object.freeze([...new Set(tags)]) : EMPTY;
}

function mergeTags(...lists) {
  const present = lists.filter(list => list?.length);
  if (!present.length) return EMPTY;
  if (present.length === 1) return present[0];
  return Object.freeze([...new Set(present.flat())]);
}

module.exports = { EMPTY_TAGS: EMPTY, normalizeTags, mergeTags };

},
"gem/statLayer.js": function (module, exports, require) {
'use strict';

/**
 * 數值加成層：把一串「屬性加成」套用到角色的基礎屬性上，回傳新的屬性物件。
 *
 * 這是寶石、裝備詞綴、刻印共用的底層，不依賴框架與寶石系統（純函式、純資料）：
 *   - 裝備與刻印詞綴：產生這種格式的加成，串在一起交給 applyStatBonuses（常駐）
 *   - 暫時效果：寶石的 BUFF 動作寫 statBonuses，編譯器用 statModifier 轉成 STAT Buff 的 effect（只在 Buff 持續期間）
 *   輔助寶石沒有常駐的效果：寶石只有「施放時」的暫時效果，常駐的數值只來自裝備與詞綴。
 *   - 介面：背包畫面想預覽最終數值，用 explainStatBonuses / applyStatBonuses 即可，不需要開戰鬥
 *
 * ── 加成的格式 ─────────────────────────────────────────────────
 *   { stat: 'cri', op: 'flat', value: 0.1, source?: 'critgem' }
 *   stat    見 STAT_DEFS
 *   op      flat  固定值：直接加在基礎值上（cri 的 0.1 = +10 個百分點）
 *           inc   加算百分比：同為 inc 的先相加，所以不會滾雪球（0.2 = +20%）
 *           more  乘算百分比：每一筆獨立相乘（0.2 = ×1.2），value 必須大於 -1
 *   source  選填，來源說明（寶石 id、裝備名稱…），只給 UI 與除錯看，不影響計算
 *
 * ── 公式（與寶石的傷害加成同一套慣例）────────────────────────────
 *   最終值 = (基礎 + Σflat) × max(0, 1 + Σinc) × Π(1 + more)
 *   再依屬性夾在合理範圍內（見 STAT_DEFS），整數屬性四捨五入。
 *
 * ── 生命與 SP ──────────────────────────────────────────────────
 *   加成算在「上限」（maxHp / maxSp，沒給就用 hp / sp）上，目前值跟著上限的增減同步移動，
 *   所以開場滿血的角色加成後仍是滿血，不會出現「上限變高、血量沒跟上」。
 *
 * ── 使用 ──────────────────────────────────────────────────────
 *   const stats = applyStatBonuses({ hp: 2000, sp: 120, atk: 150, def: 50, spd: 120, cri: 0.2 }, equipmentBonuses);
 *   new Entity({ ..., stats });
 *   忘了套用不會報錯，只是加成沒有效果（與被動沒傳給 Entity 同類的風險）。
 *
 * 要支援新的屬性：只在 STAT_DEFS 加一行。
 */

// display: 'percent' 表示固定值與百分比都以百分比顯示（0.1 → 10%）；'number' 以數字顯示。
// min / max：最終值的範圍。integer：四捨五入成整數。fallback：基礎屬性沒有這個欄位時採用的值（與框架預設一致）。
const STAT_DEFS = {
  hp:            { name: '生命',       display: 'number',  integer: true,  min: 1, fallback: null },
  sp:            { name: 'SP',        display: 'number',  integer: true,  min: 0, fallback: 0 },
  atk:           { name: '攻擊力',     display: 'number',  integer: true,  min: 0, fallback: 0 },
  def:           { name: '防禦',       display: 'number',  integer: true,  min: 0, fallback: 0 },
  int:           { name: '智力',       display: 'number',  integer: true,  min: 0, fallback: 0 },
  spd:           { name: '速度',       display: 'number',  integer: true,  min: 0, fallback: 0 },
  // 命中與閃避（框架 1.0.59 的 hitFormula: 'contest'：命中 = 200 + hit；見 docs/MECHANICS.md）
  hit:           { name: '命中',       display: 'number',  integer: true,  min: 0, fallback: 0 },
  eva:           { name: '閃避',       display: 'number',  integer: true,  min: 0, fallback: 0 },
  cri:           { name: '暴擊率',     display: 'percent', integer: false, min: 0, max: 1, fallback: 0 },
  criDmg:        { name: '暴擊傷害',   display: 'percent', integer: false, min: 1, fallback: 1.5 },
  skillCastRate: { name: '技能施放率', display: 'percent', integer: false, min: 0, max: 1, fallback: 0.35 }
};
const BONUS_OPS = new Set(['flat', 'inc', 'more']);

const finite = value => typeof value === 'number' && Number.isFinite(value);
const round4 = value => Math.round(value * 10000) / 10000;
// 三類加成合成最終值（還沒夾範圍與取整）：固定值先加，再乘加算區，再乘各筆乘算。
const combine = (base, flat, inc, more) => (base + flat) * Math.max(0, 1 + inc) * more;

/**
 * 檢查加成資料有沒有寫錯。回傳問題清單；空陣列代表沒問題。
 * @param {object[]} bonuses
 */
function validateBonuses(bonuses) {
  if (!Array.isArray(bonuses)) return ['bonuses 必須是陣列'];
  const problems = [];
  bonuses.forEach((bonus, index) => {
    const where = `第 ${index + 1} 筆加成`;
    if (!bonus || typeof bonus !== 'object') { problems.push(`${where}不是物件`); return; }
    if (!Object.hasOwn(STAT_DEFS, bonus.stat)) problems.push(`${where}使用了未知的屬性「${bonus.stat}」（支援：${Object.keys(STAT_DEFS).join('、')}）`);
    if (!BONUS_OPS.has(bonus.op)) problems.push(`${where}使用了未知的 op「${bonus.op}」（支援：flat、inc、more）`);
    if (!finite(bonus.value)) problems.push(`${where}的 value 必須是有限數字`);
    else if (bonus.op === 'more' && bonus.value <= -1) problems.push(`${where}的 more 必須大於 -1（-0.2 代表 ×0.8）`);
    if (bonus.source !== undefined && typeof bonus.source !== 'string') problems.push(`${where}的 source 必須是字串`);
  });
  return problems;
}

function assertValidBonuses(bonuses) {
  const problems = validateBonuses(bonuses);
  if (problems.length) throw new Error(`屬性加成有誤：\n- ${problems.join('\n- ')}`);
}

// 取出該屬性的「基礎值」：生命與 SP 以上限為準。
function baseOf(baseStats, stat) {
  const def = STAT_DEFS[stat];
  const raw = stat === 'hp' ? (baseStats.maxHp ?? baseStats.hp)
    : stat === 'sp' ? (baseStats.maxSp ?? baseStats.sp)
    : baseStats[stat];
  const value = raw ?? def.fallback;
  if (!finite(value)) throw new Error(`基礎屬性缺少 ${stat}（${def.name}），無法套用加成`);
  return value;
}

/**
 * 逐項算出每個有加成的屬性：基礎值、各類加成合計、最終值。給 UI 顯示「來源明細」用。
 * 沒有加成的屬性不會出現在結果裡。
 * @returns {{ stat, name, base, flat, inc, more, final, sources: string[] }[]}
 */
function explainStatBonuses(baseStats, bonuses = []) {
  assertValidBonuses(bonuses);
  const rows = [];
  for (const [stat, def] of Object.entries(STAT_DEFS)) {
    const mine = bonuses.filter(bonus => bonus.stat === stat);
    if (!mine.length) continue;
    const base = baseOf(baseStats, stat);
    const sum = op => mine.filter(bonus => bonus.op === op).reduce((total, bonus) => total + bonus.value, 0);
    const flat = sum('flat');
    const inc = sum('inc');
    const more = mine.filter(bonus => bonus.op === 'more').reduce((product, bonus) => product * (1 + bonus.value), 1);
    let final = combine(base, flat, inc, more);
    if (def.integer) final = Math.round(final);
    final = Math.max(def.min, def.max === undefined ? final : Math.min(def.max, final));
    rows.push({
      stat, name: def.name, base, flat: round4(flat), inc: round4(inc), more: round4(more),
      final: round4(final), sources: [...new Set(mine.map(bonus => bonus.source).filter(Boolean))]
    });
  }
  return rows;
}

/**
 * 把加成套用到基礎屬性，回傳新的屬性物件（不修改傳入的物件）。
 * 沒有任何加成時，回傳內容相同的副本。
 */
function applyStatBonuses(baseStats, bonuses = []) {
  const stats = { ...baseStats };
  for (const row of explainStatBonuses(baseStats, bonuses)) {
    if (row.stat === 'hp') {
      stats.maxHp = row.final;
      stats.hp = Math.max(1, Math.min(row.final, baseStats.hp + (row.final - row.base)));
    } else if (row.stat === 'sp') {
      stats.maxSp = row.final;
      stats.sp = Math.max(0, Math.min(row.final, (baseStats.sp ?? row.base) + (row.final - row.base)));
    } else {
      stats[row.stat] = row.final;
    }
  }
  return stats;
}

// 暫時的 STAT Buff 不能改生命與 SP：它們的上限與目前值要一起動，Buff 的 effect 只改「當下的有效屬性」。
const BUFF_FORBIDDEN = new Set(['hp', 'sp']);

/** 暫時 Buff 用的加成檢查：格式同 validateBonuses，另外不允許 hp、sp。 */
function validateBuffBonuses(bonuses) {
  const problems = validateBonuses(bonuses);
  if (Array.isArray(bonuses) && !bonuses.length) problems.push('statBonuses 不可為空陣列');
  if (Array.isArray(bonuses)) {
    bonuses.forEach((bonus, index) => {
      if (bonus && BUFF_FORBIDDEN.has(bonus.stat)) problems.push(`第 ${index + 1} 筆加成：暫時的 Buff 不能修改 ${bonus.stat}（${STAT_DEFS[bonus.stat].name}）`);
    });
  }
  return problems;
}

/**
 * 把加成變成框架 STAT Buff 的 effect 函式（Buff 設定裡的 effect：收到有效屬性並直接修改）。
 * 寶石資料必須是純資料，不能放函式，所以資料裡寫 statBonuses，由編譯器呼叫這裡轉成函式。
