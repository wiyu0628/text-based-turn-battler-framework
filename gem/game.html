<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>刷怪打王</title>
<script>
// 主題在畫面出來前就套上，避免閃一下淺色。沒選過就跟系統設定。
(function () {
  var theme = null;
  try { theme = localStorage.getItem('tbtf-game-theme'); } catch (e) {}
  if (theme !== 'dark' && theme !== 'light') theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
})();
</script>
<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --ink: #24211d; --muted: #77706a; --line: #e2ddd6;
    --accent: #3c5a99; --accent-soft: #e6ecf7; --good: #2f7d4f; --bad: #b03a2e; --warn: #a86b12;
    --rare: #7a4bb0; --elite: #b0412e; --energy: #2a8a8a;
    --on-accent: #fff; --input-bg: #fff; --danger-line: #e7c2bd; --faint: #c9c3bb; --energy-track: #e4eeee;
    --tag-rare-bg: #efe6f8; --tag-elite-bg: #f8e6e2; --tag-good-bg: #e3f2e8; --tag-legend-bg: #fbeed6;
    --chip: #efece7; --chip-hover: #f4d9d5; --worn-line: #9cc9ad; --worn-bg: #f6fbf8;
    --backdrop: rgba(30, 26, 22, .45); --shadow: rgba(0, 0, 0, .25);
    --log-normal: var(--ink); --log-skill: #14807a; --log-heal: #2f9e5b; --log-dot: #f56262; --log-miss: #aaa49d; --result: #f6f4f0; --result-win: #eef7f1; --result-lose: #fbefed;
    --toast-bg: #2a2622; --toast-ink: #fff;
    color-scheme: light;
  }
  /* 深色模式：頁首按鈕切換，選擇存在 localStorage（tbtf-game-theme），和遊戲存檔分開 */
  :root[data-theme="dark"] {
    --bg: #1a1917; --panel: #24221f; --ink: #e8e3dc; --muted: #a09890; --line: #3a3632;
    --accent: #86a4e6; --accent-soft: #2a3347; --good: #6cc391; --bad: #e57d70; --warn: #dba65a;
    --rare: #b993e8; --elite: #e88a76; --energy: #4fbaba;
    --on-accent: #131620; --input-bg: #1e1c1a; --danger-line: #6a3a34; --faint: #57514b; --energy-track: #2c3636;
    --tag-rare-bg: #352a45; --tag-elite-bg: #452b26; --tag-good-bg: #23392c; --tag-legend-bg: #42361f;
    --chip: #34312d; --chip-hover: #4a2f2b; --worn-line: #3f6b51; --worn-bg: #1f2a23;
    --backdrop: rgba(0, 0, 0, .6); --shadow: rgba(0, 0, 0, .6);
    --log-normal: var(--ink); --log-skill: #4fd1c5; --log-heal: #62cf8c; --log-dot: #f56262; --log-miss: #7f7a74; --result: #2b2926; --result-win: #1f3327; --result-lose: #3a2422;
    --toast-bg: #e8e3dc; --toast-ink: #1a1917;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 system-ui, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 5px 12px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  button.danger { color: var(--bad); border-color: var(--danger-line); }
  button.danger.active, button.toggle.active { background: var(--bad); color: var(--on-accent); border-color: var(--bad); }
  button.small { padding: 2px 8px; font-size: 12px; }
  select, input { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--input-bg); color: var(--ink); }
  h2 { font-size: 16px; margin: 0 0 10px; }
  h3 { font-size: 14px; margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); margin-left: 4px; vertical-align: 1px; }
  .tag.rare { background: var(--tag-rare-bg); color: var(--rare); }
  .tag.elite { background: var(--tag-elite-bg); color: var(--elite); }
  .tag.equipped { background: var(--tag-good-bg); color: var(--good); }
  .tag.legend { background: var(--tag-legend-bg); color: var(--warn); }

  header { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 18px; margin: 0; }
  nav { display: flex; gap: 4px; margin-left: 12px; }
  nav button { border: none; background: transparent; padding: 6px 14px; border-radius: 6px; }
  nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .energy { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .energy .bar { width: 160px; height: 10px; border-radius: 5px; background: var(--energy-track); overflow: hidden; }
  .energy .bar > div { height: 100%; background: var(--energy); }
  .header-actions { display: flex; gap: 6px; }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; padding: 16px 20px; max-width: 1400px; margin: 0 auto; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .stack > * + * { margin-top: 8px; }

  .hero dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; }
  .hero dt { color: var(--muted); }
  .hero dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .hero ul { margin: 4px 0 0; padding-left: 18px; }

  .difficulty { display: flex; gap: 4px; flex-wrap: wrap; }
  .difficulty button { width: 38px; padding: 5px 0; }
  .difficulty button.active { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .region-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .region-card ul { margin: 6px 0 10px; padding-left: 18px; }
  .boss { display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }

  table.bag { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  table.bag th, table.bag td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: center; }
  table.bag th:first-child, table.bag td:first-child { text-align: left; }
  table.bag td.has { cursor: pointer; }
  table.bag td.has:hover { background: var(--accent-soft); }
  table.bag td.zero { color: var(--faint); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; min-height: 28px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 12px; background: var(--chip); cursor: pointer; }
  .chip:hover { background: var(--chip-hover); }

  .item { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
  .item.worn { border-color: var(--worn-line); background: var(--worn-bg); }
  .item .name { font-weight: 600; }
  .item ul { margin: 4px 0 6px; padding-left: 16px; }
  .item .actions { display: flex; gap: 6px; margin-top: 6px; }
  .slot-col h3 { display: flex; justify-content: space-between; }
  .slot-col .stack { max-height: 70vh; overflow: auto; padding-right: 4px; }

  .link-editor select { width: 100%; }
  .error { color: var(--bad); font-size: 12px; white-space: pre-wrap; }
  .gem-list li { margin-bottom: 4px; }

  .modal-back { position: fixed; inset: 0; background: var(--backdrop); display: none; align-items: center; justify-content: center; z-index: 20; }
  #info-modal { z-index: 25; }
  #ask-modal { z-index: 30; }   /* 確認框要蓋在資料框（例如匯入存檔）上面 */
  .modal-back.open { display: flex; }
  .modal { background: var(--panel); border-radius: 12px; width: min(820px, 94vw); max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 12px 40px var(--shadow); }
  .modal header { position: static; border-radius: 12px 12px 0 0; }
  .modal .body { padding: 12px 18px; overflow: auto; flex: 1; }
  .modal footer { padding: 10px 18px; border-top: 1px solid var(--line); display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .log { font-size: 13px; }
  .log div { padding: 1px 0; }
  .log .turn { color: var(--muted); margin-top: 6px; }
  .log .normal { color: var(--log-normal); }
  .log .skill { color: var(--log-skill); }
  .log .heal { color: var(--log-heal); }
  .log .dot { color: var(--log-dot); }
  .log .miss { color: var(--log-miss); }
  .log .end { font-weight: 600; margin-top: 6px; }
  .log .crit { font-weight: 700; }
  .drop-row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 4px; }
  .chip.drop:hover { background: var(--accent-soft); }
  .log .sys { color: var(--warn); }
  .result { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--result); }
  .result.win { background: var(--result-win); }
  .result.lose { background: var(--result-lose); }
  .subtabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
  .subtabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; padding: 6px 14px; }
  .subtabs button.active { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }
  table.bag td { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  table.bag td.nopick { cursor: default; }
  table.bag td.nopick:hover { background: transparent; }
  table.bag td.sel { background: var(--accent); color: var(--on-accent); }
  table.bag tr.off td { color: var(--faint); }
  .layout.no-side { grid-template-columns: minmax(0, 1fr); }
  .layout.no-side > aside { display: none; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper strong { font-size: 20px; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
  .stepper button { width: 36px; font-size: 16px; padding: 3px 0; }
  .modal.small { width: min(420px, 92vw); }
  .export-text { width: 100%; box-sizing: border-box; font-family: ui-monospace, Menlo, monospace; font-size: 12px; resize: vertical; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--input-bg); color: var(--ink); }
  .name-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .name-row { align-items: center; }
  .name-row input { flex: 1; min-width: 0; font-weight: 600; }
  .avatar { flex: none; width: 40px; height: 40px; border-radius: 50%; overflow: hidden; display: inline-flex; align-items: center; justify-content: center;
    background: var(--accent-soft); color: var(--accent); font-weight: 700; border: 1px solid var(--line); padding: 0; min-height: 0; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar.big { width: 128px; height: 128px; font-size: 40px; }
  .battle-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .battle-head .who { font-weight: 600; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--toast-bg); color: var(--toast-ink); padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; max-width: 80vw; }
  .toast.show { opacity: 1; }
  .toast.bad { background: var(--bad); color: var(--on-accent); }
  .hero-toggle, .hero-brief { display: none; }

  /* ── 手機版面（寬度 760px 以下） ───────────────────────────── */
  @media (max-width: 760px) {
    body { font-size: 15px; }
    button { min-height: 36px; padding: 6px 12px; }
    button.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
    select, input { font-size: 16px; min-height: 36px; }   /* 16px 以上 iOS 才不會自動放大 */
    header { position: static; flex-wrap: wrap; gap: 8px 10px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); }
    header h1 { font-size: 16px; }
    .energy { gap: 6px; font-size: 13px; }
    .energy .bar { width: 72px; }
    .header-actions { order: 3; width: 100%; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 2px; }
    .header-actions button { flex: none; }
    nav { order: 4; width: 100%; margin: 0; }
    nav button { flex: 1; padding: 8px 0; }
    .layout { grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 10px; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
    .layout > aside { order: -1; }
    .panel { padding: 12px; margin-bottom: 10px; }
    .grid2, .grid4 { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .slot-col .stack { max-height: none; }
    .hero-toggle { display: inline-block; float: right; }
    .hero-brief { display: block; font-size: 13px; margin: 2px 0 8px; clear: none; }
    .hero.collapsed dl, .hero.collapsed h3, .hero.collapsed ul, .hero.collapsed > .muted:not(.hero-brief) { display: none; }
    .hero:not(.collapsed) .hero-brief { display: none; }
    .hero dl { grid-template-columns: auto 1fr auto 1fr; gap: 2px 10px; }
    .name-row { clear: both; }
    .stepper button { width: 44px; min-height: 40px; font-size: 18px; }
    .subtabs { gap: 0; }
    .subtabs button { flex: 1; padding: 8px 0; font-size: 14px; white-space: nowrap; }
    table.bag th, table.bag td { padding: 8px 2px; }
    table.bag th:first-child, table.bag td:first-child { white-space: nowrap; padding-right: 6px; }
    .chip { font-size: 13px; padding: 5px 10px; }
    .boss { flex-wrap: wrap; gap: 6px; }
    .modal-back { align-items: stretch; }
    .modal, .modal.small { width: 100vw; max-height: none; height: 100dvh; border-radius: 0; }
    .modal.small { height: auto; margin: auto 0; border-radius: 12px; width: calc(100vw - 24px); margin-left: 12px; }
    .modal header { border-radius: 0; }
    .modal .body { padding: 10px 12px; }
    .modal footer { padding: 8px 12px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    #battle-footer > span.muted { width: 100%; margin-right: 0 !important; }
    .toast { bottom: max(20px, env(safe-area-inset-bottom)); max-width: calc(100vw - 32px); }
  }
</style>
</head>
<body>
<header>
  <nav id="nav">
    <button data-tab="adventure" class="active">冒險</button>
    <button data-tab="workshop">工坊</button>
    <button data-tab="equipment">裝備</button>
    <button data-tab="gems">寶石</button>
  </nav>
  <div class="energy" title="能量：勝利與分解刻印取得，清除裝備上的刻印時消耗">
    <span>能量</span><div class="bar"><div id="energy-fill"></div></div><span id="energy-text"></span>
  </div>
  <div class="header-actions">
    <button class="small" id="theme-toggle"></button>
    <button class="small" id="export-save">匯出存檔</button>
    <button class="small" id="import-save">匯入存檔</button>
    <button class="small danger" id="reset-save">重新開始</button>
  </div>
</header>

<div class="layout">
  <main id="main"></main>
  <aside><div class="panel hero" id="hero"></div></aside>
</div>

<div class="modal-back" id="battle-modal">
  <div class="modal">
    <header><h2 id="battle-title" style="margin:0"></h2></header>
    <div class="body"><div class="battle-head"><span id="battle-avatar"></span><div><div class="who" id="battle-who"></div><div class="muted" id="battle-sub"></div></div></div><div class="log" id="battle-log"></div><div id="battle-result"></div></div>
    <footer id="battle-footer"></footer>
  </div>
</div>
<div class="modal-back" id="ask-modal">
  <div class="modal small"><div class="body" id="ask-text"></div><footer><button id="ask-no">取消</button><button class="primary" id="ask-yes">確定</button></footer></div>
</div>
<div class="modal-back" id="info-modal">
  <div class="modal small"><header><h2 id="info-title" style="margin:0"></h2></header><div class="body" id="info-body"></div><footer><button id="info-close">關閉</button></footer></div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="file-input" accept=".json,application/json" hidden>
<input type="file" id="avatar-input" accept="image/*" hidden>

<script>
// jsdom 等環境沒有 structuredClone 時的替代（瀏覽器都有）
if (typeof structuredClone !== 'function') window.structuredClone = value => JSON.parse(JSON.stringify(value));
</script>
<script>
(function () {
  var modules = {
"src/core/BattleEngine.js": function (module, exports, require) {
const Formulas = require('../utils/Formulas');
const assignBattleNames = require('../utils/BattleNames');
const Skill = require('./Skill');
const { randomLuckMessage } = require('../utils/LuckEvents');
const { random, withRandom } = require('../utils/Random');
const basicCounter = new Skill({ id: 'basic_counter', name: '反擊', actions: [{ type: 'DAMAGE', power: 1 }] });
// 沉默擋到普攻、Buff 又沒給 fallback 時的替代攻擊。照普攻收費、吃速度連擊。
const silencedStrike = new Skill({ id: 'silenced_strike', name: '攻擊', actions: [{ type: 'DAMAGE', power: 1 }] });
// 喘息回體比例。必須明顯高於力竭門檻（10%），否則喘完仍在力竭區，
// 下一兩擊就把體力打回 0，戰報會卡在「喘息→力竭→喘息」的迴圈。
const REST_SP_RATIO = 0.4;

// actionTargetResolver 與 targetSelectionResolver 共用的回傳格式檢查。
function validateTargetResolution(resolution, name) {
  if (resolution == null || Array.isArray(resolution)) return;
  if (typeof resolution === 'object' && (resolution.swapSides === true || Array.isArray(resolution.targets))) return;
  throw new Error(`${name} must return an array, { targets[, uncounterable] }, { swapSides: true[, excludeSelf] }, null or undefined.`);
}

const sideOf = targetType => targetType.startsWith('ENEMY_') ? 'ENEMY'
  : targetType.startsWith('ALLY_') ? 'ALLY' : null;

class Logger {
  constructor() {
    this.logs = [];
  }
  addLog(entry) {
    this.logs.push(entry);
  }
}

class BattleEngine {
  constructor(teamA, teamB, options = {}) {
    this.teamA = teamA;
    this.teamB = teamB;
    assignBattleNames([...teamA, ...teamB]);
    this.maxTurns = options.maxTurns || 100;
    // 自訂亂數來源（1.0.45）：() => [0, 1) 的函式，只在 start() 期間生效。不給就用 Math.random。
    if (options.rng != null && typeof options.rng !== 'function') throw new Error('rng must be a function');
    this.rng = options.rng;
    this.logger = new Logger();
    this.currentTurn = 1;
    this.result = null;
    this.summonFactory = options.summonFactory;
    this.summonCounts = new Map();
    this.nextSummonId = 1;
    this.openingLogs = options.openingLogs || [];
    this.skillResolver = options.skillResolver;
    this.skillCallStack = [];
    this.deathLogged = new Set();
    this.dialogueLogged = new Set();
    this.counterSource = null;
    this.luckEventsEnabled = options.luckEvents?.enabled ?? true;
    this.hitResolver = options.hitResolver;
    // 命中公式（1.0.59）：'classic' 是原本的「命中抵銷閃避」，'contest' 是對抗式（見 Formulas.contestEvadeChance）。
    // 預設 classic，沒指定的戰鬥結果與亂數序列不變；寫錯直接拋錯，不悄悄退回預設。
    if (options.hitFormula !== undefined && !['classic', 'contest'].includes(options.hitFormula)) {
      throw new Error(`hitFormula must be 'classic' or 'contest', got "${options.hitFormula}".`);
    }
    this.hitFormula = options.hitFormula ?? 'classic';
    this.roundStart = options.roundStart;
    this.actionTargetResolver = options.actionTargetResolver;
    // 延後的目標判定（1.0.41）：同一個行動槽第一次挑「不是自己」的目標時才問，見 docs/ACTIONS.md。
    this.targetSelectionResolver = options.targetSelectionResolver;
    // 嚴格的目標判定（1.0.47）：敵我反轉時，直接從原本那一邊挑的 options.targets 不再悄悄重抽，改成拋錯。
    // 給測試與平衡腳本開，正式戰鬥維持預設（關），寫錯的招式才不會讓整場戰鬥中斷。見 docs/ACTIONS.md。
    if (options.strictTargeting !== undefined && typeof options.strictTargeting !== 'boolean') {
      throw new Error('strictTargeting must be a boolean');
    }
    this.strictTargeting = options.strictTargeting === true;
    this.skillSelectionResolver = options.skillSelectionResolver;
    this.battleEnd = options.battleEnd;
    this.actionTargetOverride = null;
    // 每個真的出手的行動槽一筆：{ actor, skill, turn, start, end }，start／end 是 logger.logs 的索引
    // （含 start、不含 end）。反擊、觸發技能與 AFTER_ACTION 的後果都算在該槽裡。見 docs/ACTIONS.md。
    this.actionSlots = [];
    // 插隊行動（1.0.38）：insertAction 排進來的 { entity, skill, onSkip }，在目前這個行動槽結束後依序執行。
    this.insertedActions = [];
  }

  // 插隊（1.0.38）：讓 entity 在目前這個行動槽結束、下一個行動槽開始之前，額外執行一次 skill。
  // 給「能量滿了隨時可以放」的終結技、追加攻擊這類不照速度排隊的行動用。見 docs/ACTIONS.md。
  //
  // 插隊的那一槽是完整的行動槽：通知 AFTER_ACTION、記進 actionSlots（帶 inserted: true）。
  // 但它不是速度排出來的那一槽，所以不擲麻痺、不跑幸運事件與疲勞、不扣 Buff 的持續時間。
  // 輪到它時 entity 已經倒下或被必定暈眩擋住（canAct() 為 false），這次插隊就取消，並呼叫 onSkip(entity, skill)。
  insertAction(entity, skill, { onSkip } = {}) {
    if (!entity || typeof skill?.execute !== 'function') throw new Error('insertAction needs an entity and a skill.');
    if (onSkip !== undefined && typeof onSkip !== 'function') throw new Error('insertAction onSkip must be a function.');
    this.insertedActions.push({ entity, skill, onSkip });
  }

  runInsertedActions() {
    while (this.insertedActions.length && !this.result) {
      const { entity, skill, onSkip } = this.insertedActions.shift();
      if (!entity.canAct()) { onSkip?.(entity, skill); continue; }
      const allies = entity.team === 'A' ? this.teamA : this.teamB;
      const enemies = entity.team === 'A' ? this.teamB : this.teamA;
      const slotStart = this.logger.logs.length;
      const slot = entity.inBasicAttackSlot;
      entity.inBasicAttackSlot = false;
      try {
        // 插隊行動也是完整的行動槽，延後的目標判定照樣適用（1.0.41）。
        // 出手前就決定的 actionTargetResolver 維持原樣不介入，免得改掉既有消費者的行為。
        this.withActionTargetOverride(entity, this.pendingTargetResolution(entity, skill),
          () => skill.execute(entity, allies, enemies, this.logger, this));
      } finally {
        entity.inBasicAttackSlot = slot;
      }
      this.settleDeaths();
      this.checkWinCondition();
      this.notifyAction(entity, skill);
      this.actionSlots.push({ actor: entity, skill, turn: this.currentTurn,
        start: slotStart, end: this.logger.logs.length, inserted: true });
    }
    // 戰鬥結束時沒輪到的插隊直接作廢。
    if (this.result) this.insertedActions.length = 0;
  }

  // Resolve one action-slot redirect before the selected skill begins. An array preserves the
  // original fixed hostile-DAMAGE override. { swapSides: true } mirrors every non-SELF target
  // type for the whole cast, including damage, healing, recovery and buffs.
  // { targets: [...], uncounterable: true } (1.0.37) is the array form whose redirected hits
  // cannot be countered: the recipient never chose to fight the caster.
  withActionTargetOverride(caster, resolution, run) {
    const previous = this.actionTargetOverride;
    this.actionTargetOverride = resolution?.pending === true
      ? { caster, pending: true, skill: resolution.skill }
      : this.normalizeTargetResolution(caster, resolution);
    try { return run(); }
    finally { this.actionTargetOverride = previous; }
  }

  normalizeTargetResolution(caster, resolution) {
    const targets = Array.isArray(resolution) ? resolution
      : Array.isArray(resolution?.targets) ? resolution.targets : null;
    return targets?.length
      ? { caster, targets, uncounterable: !Array.isArray(resolution) && resolution.uncounterable === true }
      : resolution?.swapSides === true
        ? { caster, swapSides: true, excludeSelf: resolution.excludeSelf === true } : null;
  }

  // 有 targetSelectionResolver 時，行動槽先掛一個「還沒問」的標記，等第一次挑目標才問。
  pendingTargetResolution(caster, skill) {
    return this.targetSelectionResolver ? { pending: true, skill } : null;
  }

  // 延後的目標判定（1.0.41）。同一個行動槽裡，施放者第一次挑「不是自己」的目標時問一次
  // targetSelectionResolver，答案沿用到這個行動槽結束：後面的段落、子技能、CAST_SKILL 都吃同一個結果。
  // 只作用在自己身上的招式從頭到尾不會問，所以不會出現「判定了卻什麼都沒變」的戰報。
  // 框架不知道問的是混亂、附身還是別的東西，只負責時機與套用。
  settleTargetResolution(caster, targetType) {
    const override = this.actionTargetOverride;
    if (!override?.pending || override.caster !== caster || !sideOf(targetType)) return;
    // 先拿掉標記再問：resolver 裡要是又挑目標，不會遞迴回來重問。
    this.actionTargetOverride = null;
    const resolution = this.targetSelectionResolver({ caster, skill: override.skill, targetType, engine: this });
    validateTargetResolution(resolution, 'targetSelectionResolver');
    this.actionTargetOverride = this.normalizeTargetResolution(caster, resolution);
  }

  // 施放者這次挑 targetType 時實際可選的人（還活著）。會先觸發延後的目標判定，
  // 敵我反轉時 ENEMY_* 給的是我方、ALLY_* 給的是敵方。固定改向（{ targets }）只改 ENEMY_*。
  // 自己挑目標的招式（挑血最少的、挑層數最多的……）一律從這裡拿候選，不要直接讀 enemies：
  // 直接讀的話混亂、附身這類效果就碰不到那一招。見 docs/ACTIONS.md。
  targetPool(caster, targetType) {
    if (targetType === 'SELF') return caster.isAlive ? [caster] : [];
    const side = sideOf(targetType);
    if (!side) throw new Error(`targetPool needs ENEMY_*, ALLY_* or SELF, got "${targetType}".`);
    this.settleTargetResolution(caster, targetType);
    const override = this.actionTargetOverride?.caster === caster ? this.actionTargetOverride : null;
    if (override?.targets && side === 'ENEMY') return override.targets.filter(unit => unit.isAlive);
    const resolved = sideOf(this.resolveActionTargetType(caster, targetType));
    const own = caster.team === 'A' ? this.teamA : this.teamB;
    const other = caster.team === 'A' ? this.teamB : this.teamA;
    const excludeSelf = resolved !== side && this.swapExcludesSelf(caster);
    return (resolved === 'ENEMY' ? other : own)
      .filter(unit => unit.isAlive && !(excludeSelf && unit === caster));
  }

  // 照框架的預設規則從 targetPool 挑：單體敵人吃仇恨，單體隊友均勻抽，全體就是整個候選。
  selectTargets(caster, targetType) {
    const pool = this.targetPool(caster, targetType);
    if (!pool.length || targetType === 'SELF' || targetType.endsWith('_ALL')) return pool;
    const resolved = this.resolveActionTargetType(caster, targetType);
    const fixed = this.actionTargetOverride?.caster === caster && this.actionTargetOverride.targets;
    return [resolved === 'ENEMY_SINGLE' && !fixed ? Formulas.pickByAggro(pool)
      : pool[Math.floor(random() * pool.length)]];
  }

  // 指定目標（options.targets）在敵我反轉下還算不算數：全都站在反轉後那一邊才算，
  // 也就是透過 targetPool／selectTargets 挑出來的。直接從 enemies 挑的照舊作廢、重抽。
  forcedTargetsFollowSwap(caster, targetType, targets) {
    const side = sideOf(this.resolveActionTargetType(caster, targetType));
    if (!side || !targets.length) return false;
    return targets.every(unit => (unit.team === caster.team) === (side === 'ALLY'));
  }

  resolveActionTargetType(caster, targetType, { settle = true } = {}) {
    if (settle) this.settleTargetResolution(caster, targetType);
    const override = this.actionTargetOverride;
    if (!override || override.caster !== caster || !override.swapSides) return targetType;
    return ({
      ENEMY_SINGLE: 'ALLY_SINGLE', ENEMY_ALL: 'ALLY_ALL',
      ALLY_SINGLE: 'ENEMY_SINGLE', ALLY_ALL: 'ENEMY_ALL'
    })[targetType] || targetType;
  }

  // { swapSides: true, excludeSelf: true }：反轉後的 ALLY_* 不含施放者自己。
  // 混亂是「分不清敵我」，打到自己合理；被操控（附身、催眠）是「換了一邊」，
  // 操控者不會拿宿主的拳頭揍宿主。只影響反轉後選出來的我方目標。
  swapExcludesSelf(caster) {
    const override = this.actionTargetOverride;
    return Boolean(override?.swapSides && override.excludeSelf && override.caster === caster);
  }

  resolveActionTargets(caster, action, targets) {
    const override = this.actionTargetOverride;
    const targetType = action.targetType || 'ENEMY_SINGLE';
    if (!override?.targets || override.caster !== caster || action.type !== 'DAMAGE' ||
        !['ENEMY_SINGLE', 'ENEMY_ALL'].includes(targetType)) return targets;
    return override.targets.filter(target => target.isAlive);
  }

  resolveHit(caster, target, skill, action, hitIndex) {
    const adjustment = this.hitResolver?.({ caster, target, skill, action, hitIndex,
      turn: this.currentTurn, engine: this }) || {};
    // forceMiss（1.0.42）：這一擊必定落空，而且不擲命中骰。hitRateModifier 有 10% 的保底命中，
    // 表達不了「這一下根本碰不到」；而 untouchable 是掛在防守方身上的狀態，要先知道
    // 被打的是誰、打的是哪一招才能決定時（同一槽的第二段起才看穿），只有這裡拿得到。
    if (adjustment.forceMiss === true) {
      return { hit: false, forced: true, evadeMessage: adjustment.evadeMessage, hitMessage: adjustment.hitMessage };
    }
    const hit = Formulas.isHit(caster, target, action.accuracy || 1,
      adjustment.hitRateModifier || 0, this.hitFormula);
    adjustment.afterRoll?.(hit);
    return { hit, evadeMessage: adjustment.evadeMessage, hitMessage: adjustment.hitMessage };
  }

  // Living enemy auras affect only the ordinary active-skill lottery. Equal ids
  // apply once (strongest wins); distinct ids multiply. No state survives death.
  getSkillCastChance(actor) {
    const modifiers = new Map();
    for (const source of [...this.teamA, ...this.teamB]) {
      if (!source.isAlive || source.team === actor.team) continue;
      for (const passive of source.passives) {
        const multiplier = passive.enemySkillCastMultiplier;
        if (multiplier === undefined) continue;
        if (typeof passive.id !== 'string' || !passive.id ||
            !Number.isFinite(multiplier) || multiplier < 0 || multiplier > 1) {
          throw new Error('enemySkillCastMultiplier requires a passive id and a number in [0, 1]');
        }
        modifiers.set(passive.id, Math.min(modifiers.get(passive.id) ?? 1, multiplier));
      }
    }
    return [...modifiers.values()].reduce((chance, multiplier) => chance * multiplier,
      actor.getEffectiveStats().skillCastRate);
  }

  tryLuckEvent(actor) {
    if (!this.luckEventsEnabled || this.result || !actor.canAct()) return false;
    const enemies = (actor.team === 'A' ? this.teamB : this.teamA).filter(e => e.isAlive);
    if (!enemies.length) return false;
    const opponent = enemies.length === 1 ? enemies[0] : enemies[Math.floor(random() * enemies.length)];
    const profile = Formulas.luckEventProfile(actor, opponent);
    if (profile.gap <= 0) return false;
    const tier = Formulas.rollLuckEvent(profile);
    if (!tier) return false;
    const damage = Formulas.softenLuckDamage(
      Formulas.applyDamageVariance(tier === 'RED' ? profile.redDamage : profile.purpleDamage), tier);
    const hit = actor.takeDamage(damage, this.logger,
      { source: 'LUCK_EVENT', tier, engine: this, deferReactions: true });
    this.logger.addLog({ type: 'LUCK_EVENT', tier, actorId: actor.id, targetId: actor.id,
      opponentId: opponent.id, value: hit.damage, actionCancelled: true,
      ...randomLuckMessage(tier, actor.name, hit.damage) });
    actor.finishDamage(hit, this.logger, this);
    return true;
  }

  withSkill(caster, skill, run) {
    if (caster.isPanicked?.() || this.result || this.skillCallStack.some(call => call.caster === caster && call.skillId === skill.id)) return;
    this.skillCallStack.push({ caster, skillId: skill.id });
    try { return run(); }
    finally { this.skillCallStack.pop(); }
  }

  // Broadcast completed casts to living opponents. This is deliberately a
  // battle-level event instead of skill metadata: observers can react to old
  // and newly-added skills without every skill author opting in.
  notifySkillCast(caster, skill) {
    const observers = caster.team === 'A' ? this.teamB : this.teamA;
    const cast = { caster, skill };
    for (const observer of [...observers]) {
      if (!observer.isAlive) continue;
      observer.runDamagePassives('AFTER_SKILL_CAST', cast, this.logger, this);
    }
    // 隊友那一邊另開觸發器（1.0.48）：既有的 AFTER_SKILL_CAST 被動都假設看到的是對手，
    // 直接放寬範圍會讓它們開始對自己人起反應。施放者本人不算隊友。
    const teammates = caster.team === 'A' ? this.teamA : this.teamB;
    for (const observer of [...teammates]) {
      if (this.result) break;
      if (observer === caster || !observer.isAlive) continue;
      observer.runDamagePassives('AFTER_ALLY_SKILL_CAST', cast, this.logger, this);
    }
  }

  // 出招之前（1.0.35）：施放者的敵方可以先對這一招做手腳。cast.damageMultiplier 會乘進
  // 這次 execute 每一擊的傷害（action.damageMultiplier 之後、takeDamage 之前）。
  // 範圍與 AFTER_SKILL_CAST 相同：每次 execute 一次，含子技能、反擊技能、普攻。
  notifySkillCasting(caster, skill) {
    const cast = {
      caster, skill, damageMultiplier: 1,
      isCounter: Boolean(this.counterSource),
      isNormalAttack: skill === caster.normalAttack || caster.inBasicAttackSlot === true
    };
    if (this.result) return cast;
    const observers = caster.team === 'A' ? this.teamB : this.teamA;
    for (const observer of [...observers]) {
      if (this.result) break;
      if (!observer.isAlive) continue;
      observer.runDamagePassives('BEFORE_SKILL_CAST', cast, this.logger, this);
    }
    if (!Number.isFinite(cast.damageMultiplier) || cast.damageMultiplier < 0) {
      throw new Error('BEFORE_SKILL_CAST damageMultiplier must be a finite nonnegative number');
    }
    return cast;
  }

  // 一個行動槽真的出手之後（普攻或技能，死亡已結算），通知場上所有存活單位，
  // 包含出手者自己與隊友。暈眩、喘息、恐慌、略過都不算出手；反擊與
  // CAST_SKILL 觸發的技能屬於同一個行動槽，不另外通知。見 docs/ACTIONS.md。
  notifyAction(actor, skill) {
    if (this.result) return;
    const action = { actor, skill };
    for (const observer of [...this.teamA, ...this.teamB]) {
      if (this.result) break;
      if (!observer.isAlive) continue;
      observer.runDamagePassives('AFTER_ACTION', action, this.logger, this);
    }
    this.settleDeaths();
    this.checkWinCondition();
  }

  // 隊友選好這一槽的招之後、執行之前，問一次施放者隊友身上的 ALLY_SKILL_SELECT 被動（1.0.51），
  // 被動的 selectSkill 可以換掉這一招：例如倒在地上的人要隊友這一動改來打醒他。
  // 遭遇戰的 skillSelectionResolver 已經換過的就不問，樓層規則優先。倒下的隊友只問標了 whileDead 的被動。
  // 第一個回傳技能的被動決定；全部回傳 undefined 就照原本的招。引擎不擲骰，沒用到時亂數序列不變。
  allySkillSelection(caster, skill, allies, enemies) {
    const ctx = { caster, skill, allies, enemies };
    for (const ally of allies) {
      if (ally === caster) continue;
      for (const passive of ally.passives) {
        if (passive.trigger !== 'ALLY_SKILL_SELECT') continue;
        if (!ally.isAlive && !passive.whileDead) continue;
        if (passive.enabled && !passive.enabled(ally, ctx)) continue;
        const replacement = passive.selectSkill?.(ally, ctx, this);
        if (replacement === undefined) continue;
        if (!replacement || typeof replacement.execute !== 'function') {
          throw new Error('ALLY_SKILL_SELECT selectSkill must return a skill or undefined.');
        }
        return replacement;
      }
    }
    return skill;
  }

  // 回合開始時（遭遇戰的 roundStart 之後、疲勞與 ROUND_START Buff 之前）
  // 對每個存活單位執行 trigger: 'ROUND_START' 的被動。見 docs/ACTIONS.md。
  notifyRoundStart() {
    if (this.result) return;
    const round = { round: this.currentTurn };
    for (const entity of [...this.teamA, ...this.teamB]) {
      if (this.result) break;
      if (entity.isAlive) {
        entity.runDamagePassives('ROUND_START', round, this.logger, this);
        continue;
      }
      // 倒下的單位只跑標了 whileDead 的（1.0.43）：等著重生、倒數計時這類「人不在場也要數」的被動。
      for (const passive of [...entity.passives]) {
        if (this.result || entity.isAlive) break;
        if (passive.trigger !== 'ROUND_START' || !passive.whileDead) continue;
        if (passive.enabled && !passive.enabled(entity, round)) continue;
        passive.action?.(entity, round, this.logger, this);
      }
    }
    this.settleDeaths();
    this.checkWinCondition();
  }

  // 讓倒下的單位站回來（1.0.43）：HP 照給的值（至少 1、不超過上限），清掉死亡紀錄，之後再倒下會照常印「倒下了」。
  // 身上的東西不動：倒下時框架已經清掉觸發型 Buff，其他的留給呼叫端決定。站回來的單位這一回合還沒排進行動順序的話，
  // 照常行動；在回合開始時呼叫最自然。回傳是否真的復活了。
  revive(entity, hp) {
    if (!entity || entity.isAlive) return false;
    entity.stats.hp = Math.max(1, Math.min(entity.stats.maxHp ?? Infinity, Math.floor(hp)));
    entity.isAlive = true;
    this.deathLogged.delete(entity.id);
    return true;
  }

  // 戰鬥結束（1.0.56）：勝負已定、遭遇戰的 battleEnd 之後、BATTLE_END 日誌之前，對兩隊每個單位
  // （含倒下的）執行 trigger: 'BATTLE_END' 的被動，各一次，ctx 是 { winner }。只給結尾演出用：
  // 這時結果已經定了，被動改什麼引擎都不會再判一次。倒下的單位也跑，要不要開口由被動自己看 self.isAlive。
  notifyBattleEnd() {
    const battle = { winner: this.result };
    for (const entity of [...this.teamA, ...this.teamB]) {
      for (const passive of [...entity.passives]) {
        if (passive.trigger !== 'BATTLE_END') continue;
        if (passive.enabled && !passive.enabled(entity, battle)) continue;
        passive.action?.(entity, battle, this.logger, this);
      }
    }
  }

  // 戰鬥開場（openingLogs 與開場台詞之後、第 1 回合之前）對每個存活單位執行
  // trigger: 'BATTLE_START' 的被動，各一次。被動可以直接分出勝負：有結果就不進回合迴圈。見 docs/ACTIONS.md。
  notifyBattleStart() {
    if (this.result) return;
    const battle = { maxTurns: this.maxTurns };
    for (const entity of [...this.teamA, ...this.teamB]) {
      if (this.result) break;
      if (!entity.isAlive) continue;
      entity.runDamagePassives('BATTLE_START', battle, this.logger, this);
    }
    this.settleDeaths();
    this.checkWinCondition();
  }

  tryCounter(caster, target, skill, { action, hitIndex = 1, isComboHit = false } = {}) {
    // 宣告不可反擊的招式或擊在擲骰前就排除，不消耗判定。
    if (skill?.uncounterable || action?.uncounterable) return false;
    if (target.actionDisabled || this.counterSource || this.result || !caster.isAlive || !target.canAct()) return false;
    const override = this.actionTargetOverride;
    if (override?.uncounterable && override.caster === caster) return false;
    if (!Formulas.isCounter(caster, target, skill?.counterChanceMultiplier ?? 1)) return false;
    const callChain = this.skillCallStack.filter(call => call.caster === target).map(call => call.skillId);
    const reply = target.counterSkill?.canCast(target, this, { callChain }) ? target.counterSkill : basicCounter;
    if (reply === basicCounter && target.stats.sp < target.getBasicAttackCost()) return false;
    const source = { actorId: target.id, targetId: caster.id, incomingSkillId: skill.id };
    const buffered = [];
    const counterLogger = {
      addLog: entry => buffered.push({ ...entry, isCounter: true, counterSource: source })
    };
    const battleLogger = this.logger;
    // Death, dialogue and triggered effects log through engine.logger, so temporarily route
    // all reply output into the same buffer. This lets the summary precede consequences.
    this.logger = counterLogger;
    try {
      this.withCounterSource(source, () => {
        reply.execute(target, target.team === 'A' ? this.teamA : this.teamB,
          target.team === 'A' ? this.teamB : this.teamA, counterLogger, this,
          { targets: [caster], basicCounter: reply === basicCounter });
      });
    } finally {
      this.logger = battleLogger;
    }

    const replyHits = buffered.filter(log =>
      log.targetId === caster.id && ['DAMAGE', 'BLOCK', 'MISS'].includes(log.type));
    const value = replyHits.reduce((sum, log) => sum + (log.value || 0), 0);
    const isCrit = replyHits.some(log => log.isCrit && (log.value || 0) > 0);
    const counterBy = `${target.name}${reply === basicCounter ? '' : `以${reply.name}`}`;
    // 開頭沿用被反制那一擊自己的文案，單段是「A 使出了 X，」、多段是「第 N 擊，」。
    const incoming = Skill.composeLead(skill, action, caster, target, { hitIndex, isComboHit });
    // 反擊技能可以宣告 counterStyle: 'detailed' 換掉呈現方式（見 docs/COUNTERS.md）：
    // 濃縮版把結果塞進 COUNTER 那一句，還擊自己的傷害行會被丟掉；詳細版只讓
    // COUNTER 宣告「被反擊了」，接著原封不動放行還擊自己的文案。
    // 預設仍是濃縮：一般還擊沒有自訂文案，放行只會得到「X 攻擊，造成 N 點傷害！」
    // 這種與上一行重複的廢話。有自己演出的招式才值得多佔一行。
    const detailed = reply.counterStyle === 'detailed';
    let resultText;
    if (value > 0) resultText = `${isCrit ? '會心一擊！' : ''}受到 ${value} 點傷害！`;
    else if (replyHits.some(log => log.type === 'BLOCK')) resultText = `反擊被${caster.name}擋下了！`;
    else if (replyHits.some(log => log.type === 'MISS')) resultText = '反擊落空了！';
    else resultText = '反擊成功！';
    battleLogger.addLog({ type: 'COUNTER', actorId: target.id, targetId: caster.id,
      skillId: reply.id, skillTier: reply.tier, isNormalAttack: reply === basicCounter,
      incomingSkillId: skill.id, value, isCrit,
      ...(replyHits.some(log => log.partId) ? { partHits: replyHits.filter(log => log.partId).map(log => ({
        partId: log.partId, partName: log.partName, partDamage: log.partDamage, actualDamage: log.actualDamage
      })) } : {}),
      // 詳細版的 value／isCrit 仍然照舊寫進紀錄，換掉的只有句子——
      // 統計與 UI 讀的是欄位，不該因為換了呈現方式就少一筆數字。
      message: `${incoming}但是遭${counterBy}反擊${detailed ? '！' : `，${resultText}`}` });
    // The reply's damage is represented by the COUNTER line. Keep status, death and dialogue logs.
    // 只丟還擊招式自己的開場白：還擊者以還擊招式（或它帶出的子招式）id 記下的 SKILL_TEXT。
    // 其他 SKILL_TEXT 照常保留——原攻擊者被打到觸發的鎖血台詞、旁觀者的被動、
    // 還擊者自己在還擊途中觸發的被動台詞，都跟還擊招式的文案無關。
    const replySkillIds = new Set([reply.id, ...buffered
      .filter(log => log.actorId === target.id && ['DAMAGE', 'BLOCK', 'MISS'].includes(log.type) && log.skillId)
      .map(log => log.skillId)]);
    (detailed ? buffered : buffered.filter(log => !replyHits.includes(log) &&
      !(log.type === 'SKILL_TEXT' && log.actorId === target.id && replySkillIds.has(log.skillId))))
      .forEach(log => battleLogger.addLog(log));
    return true;
  }

  withCounterSource(source, run) {
    const previous = this.counterSource;
    this.counterSource = previous || source || null;
    try { return run(); }
    finally { this.counterSource = previous; }
  }

  getCastableSkills(caster, skillIds, callChain = this.skillCallStack
    .filter(call => call.caster === caster).map(call => call.skillId)) {
    if (typeof this.skillResolver !== 'function') throw new Error('CAST_SKILL requires skillResolver(id).');
    if (!Array.isArray(skillIds) || !skillIds.length || skillIds.some(id => typeof id !== 'string' || !id)) {
      throw new Error('CAST_SKILL requires a non-empty skillIds array.');
    }
    return [...new Set(skillIds)].map(id => {
      const skill = this.skillResolver(id);
      if (!skill || typeof skill.execute !== 'function' || typeof skill.canCast !== 'function') {
        throw new Error(`Unknown or invalid skill "${id}".`);
      }
      return skill;
    }).filter(skill => skill.canCast(caster, this, { ignoreSp: true, callChain }));
  }

  // Calls use the skill's own targeting and metadata, without an action slot or child SP cost.
  castSkill(caster, skillIds, options = {}) {
    if (!caster.isAlive || caster.isPanicked?.() || this.result) return;
    const pool = this.getCastableSkills(caster, skillIds);
    if (!pool.length) return;
    const skill = pool[Math.floor(random() * pool.length)];
    const allies = caster.team === 'A' ? this.teamA : this.teamB;
    const enemies = caster.team === 'A' ? this.teamB : this.teamA;
    skill.execute(caster, allies, enemies, this.logger, this, { ...options, ignoreSp: true });
    return skill;
  }

  dialogue(entity, event) {
    const text = entity.dialogues?.[event];
    const key = `${entity.id}:${event}`;
    if (!text || this.dialogueLogged.has(key)) return;
    this.dialogueLogged.add(key);
    this.logger.addLog({ type: 'BOSS_DIALOGUE', actorId: entity.id,
      message: `${entity.name}：「${text}」` });
  }

  settleDeaths() {
    for (const entity of [...this.teamA, ...this.teamB]) {
      if (entity.isAlive || this.deathLogged.has(entity.id)) continue;
      this.deathLogged.add(entity.id);
      entity.buffs = entity.buffs.filter(buff => !buff.trigger);
      this.logger.addLog({ type: 'DEATH', actorId: entity.id, message: `${entity.name} 倒下了！` });
      this.dialogue(entity, 'death');
    }
  }

  triggerBuffs(entity, event) {
    for (const buff of [...entity.buffs]) {
      if (!entity.isAlive || (event === 'BEFORE_ACTION' && entity.isPanicked?.()) || this.result) break;
      if (!entity.buffs.includes(buff) || buff.trigger !== event || buff.remainingTriggers <= 0) continue;
      if (event === 'ROUND_START') {
        if (buff.appliedRound === this.currentTurn || buff.lastTriggeredRound === this.currentTurn) continue;
        buff.lastTriggeredRound = this.currentTurn;
      }
      // Consume before invoking: refreshed/reentrant effects cannot fire twice in this pass.
      buff.remainingTriggers--;
      if (!buff.remainingTriggers) entity.buffs = entity.buffs.filter(b => b !== buff);
      this.withCounterSource(buff.counterSource, () => this.castSkill(entity, buff.skillIds));
    }
  }

  canSummon(caster, action) {
    // maxAlive 掃兩邊陣營：敵對的增援（summonHostile）站在對面，只看自己這隊會漏算，
    // 變成「召出來的是敵人就不佔名額」。
    const summoned = [...this.teamA, ...this.teamB]
      .filter(e => e.isAlive && e.summonerId === caster.id).length;
    return caster.isAlive && typeof this.summonFactory === 'function' &&
      (this.summonCounts.get(caster.id) || 0) < (action.maxTotal ?? 4) &&
      summoned < (action.maxAlive ?? 2);
  }

  summon(caster, action, skill) {
    if (!this.canSummon(caster, action)) return;
    let id;
    do { id = `summon_${this.nextSummonId++}`; }
    while ([...this.teamA, ...this.teamB].some(e => e.id === id));
    const pool = action.monsterIds;
    const monsterId = pool?.length ? pool[Math.floor(random() * pool.length)] : action.monsterId;
    const entity = this.summonFactory(monsterId, { entityId: id });
    // 計數的是「嘗試」而不是「成功」：招不到人也用掉了這次機會。
    // 只算成功的話，maxTotal 就從「一場只能召喚一次」變成「一場只能成功一次」，
    // 招不到人的技能會在之後每個行動槽重試並把戰報洗滿失敗訊息。
    const count = (this.summonCounts.get(caster.id) || 0) + 1;
    this.summonCounts.set(caster.id, count);
    // 工廠回傳 null／undefined 代表「這次沒有可用的增援」——素材耗盡、
    // 牢籠已空、放下的印記沒人回應。這是遊戲層才知道的事，框架只負責不要炸掉，
    // 並讓技能用 text.fail 決定這一行怎麼寫。
    if (!entity) {
      this.logger.addLog({ type: 'SUMMON_FAILED', actorId: caster.id,
        skillId: skill.id, skillTier: skill.tier, isNormalAttack: false,
        message: skill.summonFailMessage(action, caster) });
      return;
    }
    // 增援預設加入召喚者的陣營，但工廠可以把實體標成 summonHostile 讓它站到對面。
    // 召喚不保證是幫手——儀式失控、信號引來了入侵者、牢籠裡放出來的東西不認主人。
    // summonerId 照樣記，敵對的增援也追得回是誰招來的。
    const hostile = entity.summonHostile === true;
    entity.team = hostile ? (caster.team === 'A' ? 'B' : 'A') : caster.team;
    entity.summonerId = caster.id;
    (entity.team === 'A' ? this.teamA : this.teamB).push(entity);
    this.logger.addLog({ type: 'SUMMON', actorId: caster.id, targetId: id,
      skillId: skill.id, isNormalAttack: false,
      message: skill.summonMessage(action, caster, entity) });
    entity.sanity?.announce(entity, this.logger, this, this.currentTurn);
  }

  // 一次性跑完戰鬥
  start() {
    return withRandom(this.rng, () => this.runToEnd());
  }

  runToEnd() {
    this.logger.addLog({ type: 'BATTLE_START', message: '戰鬥開始！' });
    this.openingLogs.forEach(log => this.logger.addLog(log));
    [...this.teamA, ...this.teamB].filter(e => e.isAlive).forEach(e => this.dialogue(e, 'opening'));
    this.checkWinCondition();
    this.notifyBattleStart();

    while (this.currentTurn <= this.maxTurns && !this.result) {
      this.executeTurn();
      this.checkWinCondition();
      this.currentTurn++;
    }

    if (!this.result) {
      this.result = 'DRAW'; // 達到最大回合數平手
      this.logger.addLog({ type: 'TEXT', message: `雙方大戰300回合，沒有分出勝負` });
    }

    // 勝負已定、BATTLE_END 之前：遭遇戰可以在這裡補上結尾演出（例如回顧 actionSlots 的精彩重播）。
    // 這時已經不能改變結果，回傳值不使用。
    this.battleEnd?.(this);
    this.notifyBattleEnd();

    this.logger.addLog({ type: 'BATTLE_END', message: `戰鬥結束，獲勝方: ${this.result}` });

    return {
      winner: this.result,
      logs: this.logger.logs,
      finalTeamA: this.teamA,
      finalTeamB: this.teamB
    };
  }

  executeTurn() {
    if (this.result) return;
    this.logger.addLog({ type: 'TURN_START', turn: this.currentTurn, message: `--- 第 ${this.currentTurn} 回合 ---` });
    for (const entity of [...this.teamA, ...this.teamB]) {
      if (!entity.sanity) continue;
      if (entity.sanity.initialPanicPending) entity.sanity.announce(entity, this.logger, this);
      entity.sanity.round = this.currentTurn;
      if (this.result) return;
    }
    this.roundStart?.(this);
    this.notifyRoundStart();
    if (this.result) return;

    const allEntities = [...this.teamA, ...this.teamB];
    for (const entity of allEntities) if (entity.isAlive) entity.syncFatigue(this.logger);
    for (const entity of allEntities) this.triggerBuffs(entity, 'ROUND_START');
    if (this.result) return;
    const turnOrder = Formulas.determineActionOrder(allEntities);

    for (const entity of turnOrder) {
      // 上一個行動槽（不論它怎麼結束）排進來的插隊，在下一個行動槽開始前執行。
      this.runInsertedActions();
      if (!entity.isAlive) continue;
      if (this.result) break; // 戰鬥已結束

      // 1. Pre-turn (Buffs DOT/HOT)
      for (const buff of [...entity.buffs]) {
        if (!entity.isAlive || this.result) break;
        this.withCounterSource(buff.counterSource, () => buff.onPreTurn(entity, this.logger, this));
      }
      if (!entity.isAlive) {
        this.settleDeaths();
        this.checkWinCondition();
        continue;
      }
      if (this.result) break;

      if (entity.isPanicked()) {
        entity.tickBuffs();
        continue;
      }

      // 2. 判斷是否能行動
      // 這是每個行動槽唯一一次 STUN 擲骰的地方；必定暈眩與機率型麻痺都走這條。
      const stun = entity.rollStun();
      if (stun) {
        this.logger.addLog({
          type: 'TEXT', actorId: entity.id, buffId: stun.id, message: stun.blockMessage(entity)
        });
      } else if (!entity.actionDisabled && entity.getFatigueStage() === 'EXHAUSTED' && random() < 0.2) {
        this.logger.addLog({ type: 'FATIGUE_SKIP', actorId: entity.id, message: `${entity.name} 累得無法動彈` });
      } else {
        this.triggerBuffs(entity, 'BEFORE_ACTION');
        if (this.result) break;
        if (!entity.isAlive) continue;
        if (entity.isPanicked()) {
          entity.tickBuffs();
          continue;
        }
        if (this.tryLuckEvent(entity)) {
          entity.tickBuffs();
          continue;
        }
        if (entity.actionDisabled) {
          this.logger.addLog({ type: 'TEXT', actorId: entity.id, message: `${entity.name}沒有動。` });
          entity.tickBuffs();
          continue;
        }
        // 3. 行動：選擇技能與目標
        const allies = entity.team === 'A' ? this.teamA : this.teamB;
        const enemies = entity.team === 'A' ? this.teamB : this.teamA;

        // 技能選擇邏輯：預設 35% 機率釋放技能，否則普通攻擊
        let selectedSkill = null;
        // 被沉默擋下的那一招與擋下它的 Buff。一個行動槽最多印一行沉默，
        // 指的是原本想用的那一招（技能被擋、改用的普攻也被擋時，仍寫原本的技能）。
        let silenced = null;
        const checkSilence = () => {
          const buff = entity.silencedBy(selectedSkill);
          if (buff && !silenced) silenced = { buff, skill: selectedSkill };
          return buff;
        };
        if (!entity.hasActed && entity.openingSkill?.canCast(entity, this)) selectedSkill = entity.openingSkill;
        if (selectedSkill && checkSilence()) selectedSkill = null;
        entity.hasActed = true;
        const skillCastChance = this.getSkillCastChance(entity);

        if (!selectedSkill && entity.skills && entity.skills.length > 0 && random() < skillCastChance) {
          // 若決定使用技能，從擁有的技能中隨機抽取一個「可施放」的技能
          const castableSkills = entity.skills.filter(s => s.canCast(entity, this));
          if (castableSkills.length > 0) {
            const randomIndex = Math.floor(random() * castableSkills.length);
            selectedSkill = castableSkills[randomIndex];
            // 抽選照舊從可施放的技能裡抽，抽到被沉默的招才退回普攻。
            // 先過濾再抽會改變沒被沉默的招的機率，也會多吃或少吃亂數。
            if (checkSilence()) selectedSkill = null;
          }
        }

        // 若機率未觸發，或技能皆無法施放，則使用普通攻擊
        if (!selectedSkill && entity.normalAttack) {
          const needsHitCost = entity.normalAttack.dealsBasicAttackDamage;
          if ((needsHitCost && entity.stats.sp < entity.getBasicAttackCost()) || entity.normalAttack.canCast?.(entity, this) === false) {
            const value = entity.restoreSp(Math.max(1, Math.ceil(entity.stats.maxSp * REST_SP_RATIO)));
            // 喘息的文案與後果交給 AFTER_REST 被動（1.0.34）：第一個提供 restMessage 的啟用中被動換掉預設句，
            // 全部啟用中的被動在喘息日誌之後執行。見 docs/ACTIONS.md。
            const rest = { value };
            const restPassives = entity.passives.filter(passive => passive.trigger === 'AFTER_REST' &&
              (!passive.enabled || passive.enabled(entity, rest)));
            const custom = restPassives.find(passive => typeof passive.restMessage === 'function');
            this.logger.addLog({ type: 'REST', actorId: entity.id, value,
              message: custom ? custom.restMessage(entity, rest) : `${entity.name} 暫時停下攻勢，調整呼吸` });
            if (restPassives.length) {
              entity.runDamagePassives('AFTER_REST', rest, this.logger, this);
              this.settleDeaths();
              this.checkWinCondition();
            }
            entity.syncFatigue(this.logger);
            entity.tickBuffs();
            continue;
          }
          selectedSkill = entity.normalAttack;
          const blocker = checkSilence();
          if (blocker) selectedSkill = blocker.silence.fallback || silencedStrike;
        }
        if (silenced) {
          this.logger.addLog({ type: 'SILENCED', actorId: entity.id, buffId: silenced.buff.id,
            skillId: silenced.skill.id, message: silenced.buff.silenceMessage(entity, silenced.skill) });
        }

        let replacedByEncounter = false;
        if (selectedSkill && this.skillSelectionResolver) {
          const replacement = this.skillSelectionResolver({
            caster: entity, skill: selectedSkill, allies, enemies, engine: this
          });
          if (replacement !== undefined) {
            if (!replacement || typeof replacement.execute !== 'function') {
              throw new Error('skillSelectionResolver must return a skill or undefined.');
            }
            selectedSkill = replacement;
            replacedByEncounter = true;
          }
        }
        if (selectedSkill && !replacedByEncounter) selectedSkill = this.allySkillSelection(entity, selectedSkill, allies, enemies);

        if (selectedSkill && !entity.isPanicked()) {
          // 標記「這個行動槽是普攻」，派發型普攻轉發給子技能後仍收得到逐擊費用。
          // 一併看 dealsBasicAttackDamage：沒表態的普攻維持原本行為，這個旗標
          // 才真的是選擇加入的，不會默默改掉既有 Boss 的收費。
          // 沉默的替代攻擊頂的是普攻的位置，一樣逐擊收費、吃速度連擊。
          const replacesNormalAttack = silenced && selectedSkill === (silenced.buff.silence.fallback || silencedStrike);
          entity.inBasicAttackSlot = (selectedSkill === entity.normalAttack || replacesNormalAttack)
            && selectedSkill.dealsBasicAttackDamage === true;
          const slotStart = this.logger.logs.length;
          try {
            const redirected = this.actionTargetResolver?.({
              caster: entity, skill: selectedSkill, allies, enemies, engine: this
            });
            validateTargetResolution(redirected, 'actionTargetResolver');
            this.withActionTargetOverride(entity, redirected ?? this.pendingTargetResolution(entity, selectedSkill),
              () => { if (!entity.isPanicked()) selectedSkill.execute(entity, allies, enemies, this.logger, this); });
          } finally {
            entity.inBasicAttackSlot = false;
          }
          this.settleDeaths();
          this.checkWinCondition();
          this.notifyAction(entity, selectedSkill);
          // 分出勝負的那一槽也要記，notifyAction 在有結果時不通知，但這一槽確實出手了。
          this.actionSlots.push({ actor: entity, skill: selectedSkill, turn: this.currentTurn,
            start: slotStart, end: this.logger.logs.length });
        } else if (!entity.isPanicked()) {
          this.logger.addLog({ type: 'TEXT', actorId: entity.id, message: `${entity.name} 略過了行動 (無技能且無普通攻擊可用)。` });
        }
      }

      // 4. Post-turn (減少 Buff 回合數)
      entity.tickBuffs();
    }
    this.runInsertedActions();
    const sanityEntities = [...this.teamA, ...this.teamB].filter(entity => entity.sanity);
    if (sanityEntities.length) this.checkWinCondition();
    if (!this.result) {
      for (const entity of sanityEntities) {
        if (this.result) break;
        entity.sanity?.endRound(entity, this.logger, this);
        this.settleDeaths();
        this.checkWinCondition();
      }
    }
  }

  checkWinCondition() {
    if (this.result) return;

    const teamAAlive = this.teamA.some(e => e.isAlive);
    const teamBAlive = this.teamB.some(e => e.isAlive);

    if (!teamAAlive && !teamBAlive) {
      this.result = 'DRAW';
    } else if (!teamAAlive) {
      this.result = 'TEAM_B';
    } else if (!teamBAlive) {
      this.result = 'TEAM_A';
    }
    if (this.result === 'TEAM_A' || this.result === 'TEAM_B') {
      const winners = this.result === 'TEAM_A' ? this.teamA : this.teamB;
      winners.filter(e => e.isAlive).forEach(e => this.dialogue(e, 'victory'));
    }
  }
}

module.exports = BattleEngine;

},
"src/core/BodyParts.js": function (module, exports, require) {
const { random } = require('../utils/Random');
function createBodyParts(configs) {
  if (!Array.isArray(configs)) throw new Error('parts must be an array');
  const ids = new Set();
  return configs.map(({ id, name = id, maxDurability }) => {
    if (typeof id !== 'string' || !id || ids.has(id) || typeof name !== 'string' || !name ||
        !Number.isSafeInteger(maxDurability) || maxDurability <= 0) {
      throw new Error('Each part needs a unique id, a name and positive integer maxDurability');
    }
    ids.add(id);
    return { id, name, maxDurability, durability: maxDurability, broken: false };
  });
}

// Broken parts remain hittable. No parts means no extra random draw.
function selectBodyPart(parts) {
  return parts.length ? parts[Math.floor(random() * parts.length)] : null;
}

function damageBodyPart(part, actualDamage, multiplier) {
  const partDamage = Math.min(part.durability, Math.floor(actualDamage * multiplier));
  const brokePart = !part.broken && partDamage > 0 && partDamage === part.durability;
  part.durability -= partDamage;
  if (brokePart) part.broken = true;
  return { partId: part.id, partName: part.name, partDamage,
    partDurability: part.durability, partMaxDurability: part.maxDurability, brokePart };
}

module.exports = { createBodyParts, selectBodyPart, damageBodyPart };

},
"src/core/Buff.js": function (module, exports, require) {
const { normalizeTags } = require('../utils/Tags');
const { random } = require('../utils/Random');

class Buff {
  constructor({ id, name, type, duration, value, effect, trigger, remainingTriggers, skillIds, chance, message, polarity = 'neutral', dispellable = false, invincible = false, untouchable = false, tags, damageTaken, healTaken, silence, shield }) {
    if (!['positive', 'negative', 'neutral'].includes(polarity) || typeof dispellable !== 'boolean' ||
        typeof invincible !== 'boolean' || typeof untouchable !== 'boolean') {
      throw new Error('Invalid buff polarity, dispellable, invincible or untouchable');
    }
    this.polarity = polarity;
    // 自由標籤，DOT 扣血時放進 hit.tags，見 docs/TAGS.md。
    this.tags = normalizeTags(tags, `Buff "${id}"`);
    this.dispellable = dispellable;
    this.invincible = invincible;
    // 打不到：DAMAGE 的每一擊不擲命中骰，直接落空（見 docs/PROTECTION.md）。
    // 跟 invincible 的差別是「沒碰到」而不是「碰到了但沒受傷」，所以走閃避那條路。
    this.untouchable = untouchable;
    // 承傷倍率（1.0.26）：持有者受到的傷害先乘上 multiplier，再跑 BEFORE_DAMAGE。
    // filter(hit) 決定哪些傷害算數（例如只放大法術）；省略時只作用在 DAMAGE 攻擊，
    // DOT 與環境／直接扣血不受影響。見 docs/PROTECTION.md。
    if (damageTaken !== undefined) {
      const { multiplier, filter } = damageTaken || {};
      if (!Number.isFinite(multiplier) || multiplier < 0 ||
        (filter !== undefined && typeof filter !== 'function')) {
        throw new Error(`Buff "${id}" damageTaken needs a finite nonnegative multiplier and an optional filter function.`);
      }
      this.damageTaken = { multiplier, filter: filter || (hit => hit.source === 'ATTACK') };
    }
    // 治療承受倍率（1.0.33）：持有者受到的所有治療（HEAL 招式、HOT、遊戲層呼叫 heal）乘上 multiplier。
    // damageTaken 的對稱版本，給減療、老化這類「補了也只回一部分」的效果用。見 docs/PROTECTION.md。
    if (healTaken !== undefined) {
      const { multiplier } = healTaken || {};

    // LAST_STAND 暫存的日誌：排在這一擊本身（傷害行、碎盾、部位破壞）之後、受傷反應之前。
    for (const entry of hit.pendingLogs || []) logger?.addLog(entry);
    if (hit.actualDamage > 0) this.runDamagePassives('AFTER_DAMAGE_RECEIVED', hit, logger, engine);
    engine?.settleDeaths();
    if (hit.damage > 0 && this.isAlive) this.checkPassives('ON_HP_CHANGE', logger, engine);
    if (!engine?.result && hit.damage > 0 && this.isAlive && hit.caster?.isAlive) {
      for (const passive of [...hit.caster.passives]) {
        if (!this.isAlive || !hit.caster.isAlive || engine?.result) break;
        if (passive.trigger !== 'AFTER_DAMAGE_DEALT') continue;
        if (passive.enabled && !passive.enabled(hit.caster, hit)) continue;
        passive.action?.(hit.caster, hit, logger, engine);
      }
    }
    engine?.settleDeaths();
    engine?.checkWinCondition();
  }

  // New receive/break hooks also report lethal hits. Reactive skills should
  // guard self.isAlive; observers can still record the final actual HP loss.
  runDamagePassives(trigger, hit, logger, engine) {
    for (const passive of [...this.passives]) {
      // 勝負已定就不再跑，免得結果出來之後還有人掛 Buff、扣血、插隊。
      // 標了 afterResult 的被動照跑（1.0.50）：打倒最後一個敵人時的台詞這類只做演出的反應，
      // 否則它們在最需要出現的那一擊反而永遠不會觸發。它們不能改變結果，引擎也不會再判一次勝負。
      if (engine?.result && !passive.afterResult) continue;
      if (passive.trigger !== trigger) continue;
      if (passive.enabled && !passive.enabled(this, hit)) continue;
      passive.action?.(this, hit, logger, engine);
    }
  }

  // 治療承受倍率（1.0.33）：身上所有 healTaken 相乘。沒有這種 buff 時原數奉還，連取整都不做。
  scaleHealing(amount) {
    const buffs = this.buffs.filter(buff => buff.healTaken);
    if (!buffs.length || !(amount > 0)) return amount;
    return Math.floor(buffs.reduce((value, buff) => value * buff.healTaken.multiplier, amount));
  }

  // scaled：呼叫端已經套過 scaleHealing（HOT 要先算出實際回復量才能印日誌）。
  heal(amount, logger, { engine, deferReactions = false, scaled = false } = {}) {
    if (!this.isAlive) return 0;
    if (!scaled) amount = this.scaleHealing(amount);
    const before = this.stats.hp;
    this.stats.hp = Math.min(this.stats.maxHp, this.stats.hp + amount);
    if (!deferReactions) this.checkPassives('ON_HP_CHANGE', logger, engine);
    return this.stats.hp - before;
  }

  getFatigueStage() {
    if (!this.fatigueEnabled || this.stats.maxSp <= 0) return 'NORMAL';
    const ratio = this.stats.sp / this.stats.maxSp;
    return ratio <= 0.1 ? 'EXHAUSTED' : ratio <= 0.5 ? 'TIRED' : 'NORMAL';
  }

  syncFatigue(logger) {
    const stage = this.getFatigueStage();
    if (!logger || stage === this.reportedFatigue) return;
    // 兩句台詞都在描述惡化，回復時播出來會變成「剛喘完就開始有點喘」。
    // 因此只在階段變嚴重時出字，變輕鬆只更新狀態，等體力再掉下去才重播。
    const worsened = FATIGUE_SEVERITY[stage] > FATIGUE_SEVERITY[this.reportedFatigue];
    this.reportedFatigue = stage;
    if (worsened) logger.addLog({ type: 'FATIGUE', actorId: this.id, stage,
      message: `${this.name} ${stage === 'TIRED' ? '開始有點喘' : '快累到不行了'}` });
  }

  getBasicAttackCost() {
    return this.stats.maxSp > 0 ? this.normalAttackSpCost : 0;
  }

  spendSp(amount, logger) {
    if (!Number.isFinite(amount) || amount < 0) throw new Error('SP cost must be finite and nonnegative');
    if (this.stats.sp < amount) return false;
    this.stats.sp -= amount;
    this.syncFatigue(logger);
    return true;
  }

  restoreSp(amount, logger) {
    if (!this.isAlive) return 0;
    const restored = Math.max(0, Math.min(this.stats.maxSp - this.stats.sp, Math.floor(amount)));
    this.stats.sp += restored;
    if (logger) this.syncFatigue(logger);
    else if (this.getFatigueStage() === 'NORMAL') this.reportedFatigue = 'NORMAL';
    return restored;
  }

  checkPassives(triggerEvent, logger, engine) {
    if (!logger || !this.isAlive) return;
    [...this.passives].forEach(passive => {
      if (passive.triggered || !this.isAlive || engine?.result) return;

      if (triggerEvent === 'ON_HP_CHANGE' && passive.condition === 'HP_BELOW') {
         if ((this.stats.hp / this.stats.maxHp) <= passive.threshold) {
            passive.triggered = true;
            if (passive.action) {
               passive.action(this, logger, engine);
            }
         }
      }
    });
  }

  checkDeath() {
    if (this.stats.hp <= 0) {
      this.stats.hp = 0;
      this.isAlive = false;
      this.buffs = this.buffs.filter(buff => !buff.trigger);
    }
  }

  removeBuffs(polarity) {
    if (!['positive', 'negative'].includes(polarity)) throw new Error('removeBuffs requires positive or negative');
    const removed = this.buffs.filter(buff => buff.dispellable && buff.polarity === polarity);
    this.buffs = this.buffs.filter(buff => !removed.includes(buff));
    return removed;
  }

  // 回傳掛上的 Buff（1.0.49）。子類或遊戲端可以覆寫 addBuff 拒收（魔法抗性之類），
  // 拒收時回傳 false：BUFF action 看到 false 就不印「掛上了」的那一句。
  addBuff(buffConfig, context) {
    if (buffConfig.stackPolicy === 'refresh') {
      this.buffs = this.buffs.filter(buff => buff.id !== buffConfig.id);
    }
    const buff = new Buff(buffConfig);
    if (context?.counterSource) buff.counterSource = { ...context.counterSource };
    buff.appliedRound = context?.currentTurn;
    this.buffs.push(buff);
    return buff;
  }

  // 回合結束時，減少所有 buff 持續時間，並清除過期的
  tickBuffs() {
    this.buffs.forEach(b => { if (!b.trigger) b.duration--; });
    this.buffs = this.buffs.filter(b => b.trigger ? b.remainingTriggers > 0 : b.duration > 0);
  }

  // 判斷是否能行動 (例如是否有暈眩 Buff)
  // 只認「必定無法行動」的暈眩（chance 1）。機率型麻痺不在這裡擲骰：
  // canAct() 在一個行動槽裡會被呼叫不只一次（幸運事件、以及對手打過來時的反擊判定），
  // 擲骰放進來會在同一個槽裡擲出互相矛盾的結果。
  // 機率型的判定集中在 rollStun()，由 BattleEngine 在行動槽開頭呼叫剛好一次。
  // 代價是機率型麻痺不影響反擊與幸運事件，只擋主動行動——這是刻意的取捨。
  canAct() {
    if (!this.isAlive || this.isPanicked()) return false;
    return !this.buffs.some(b => b.type === 'STUN' && b.chance >= 1);
  }

  // 這個行動槽有沒有被麻痺擋下。回傳擋下它的 Buff（讓呼叫端取用自訂文案），沒有就是 null。
  rollStun() {
    if (!this.isAlive) return null;
    return this.buffs.find(b => b.type === 'STUN' && b.rollBlock()) || null;
  }

  // 這一招有沒有被沉默擋下。回傳擋下它的 Buff，沒有就是 null。見 docs/SILENCE.md。
  silencedBy(skill) {
    if (!skill) return null;
    return this.buffs.find(b => b.silence && b.silence.filter(skill, this)) || null;
  }

  // 取得加成後的能力值
  getEffectiveStats() {
    const effectiveStats = { ...this.stats };
    this.buffs.filter(b => b.type === 'STAT').forEach(b => {
      if (typeof b.effect === 'function') {
        b.effect(effectiveStats);
      }
    });
    // Apply every STAT effect before clamping, so opposing buffs can cancel.
    const stage = this.getFatigueStage();
    const multiplier = stage === 'TIRED' ? 0.8 : stage === 'EXHAUSTED' ? 0.6 : 1;
    for (const key of ['atk', 'def', 'int', 'spd', 'hit', 'eva', 'counter', 'luk', 'cri']) {
      if (typeof effectiveStats[key] === 'number') effectiveStats[key] *= multiplier;
    }
    if (multiplier !== 1) effectiveStats.criDmg = 1 + Math.max(0, (effectiveStats.criDmg || 1.5) - 1) * multiplier;
    // 施放率扣百分點而不是乘倍率，跟 Buff 調整施放率的慣例一致；
    // 在夾限之前扣，才能跟 Buff 的加減互相抵銷。
    effectiveStats.skillCastRate -= FATIGUE_CAST_PENALTY[stage] || 0;
    if (this.sanity) effectiveStats.skillCastRate += this.sanity.castRateModifier(this);
    if (!Number.isFinite(effectiveStats.skillCastRate)) {
      throw new Error('Effective skillCastRate must be finite');
    }
    effectiveStats.skillCastRate = Math.max(0, Math.min(1, effectiveStats.skillCastRate));
    for (const key of this.lockedStats) effectiveStats[key] = 0;
    return effectiveStats;
  }
}

module.exports = Entity;

"src/core/Sanity.js": function (module, exports, require) {
// Rules are stateless and may be shared; each Entity owns a separate Sanity instance.
function createSanityRules(overrides = {}) {
  if (!overrides || typeof overrides !== 'object' || Array.isArray(overrides)) {
    throw new Error('Sanity rule overrides must be an object');
  }
  const rules = {
    castRateModifier: ({ value, min, max, neutral }) =>
      0.1 * (value - neutral) / (value < neutral ? neutral - min : max - neutral),
    recoveryAmount: ({ min, max }) => (max - min) * 0.05,
    getState: ({ value, neutral }) => value < neutral ? 'SHAKEN' : value > neutral ? 'INSPIRED' : 'NEUTRAL',
    panicEnabled: true,
    ...overrides
  };
  for (const key of ['castRateModifier', 'recoveryAmount', 'getState']) {
    if (typeof rules[key] !== 'function') throw new Error(`Sanity ${key} must be a function`);
  }
  if (typeof rules.panicEnabled !== 'boolean') throw new Error('Sanity panicEnabled must be boolean');
  return Object.freeze(rules);
}

class Sanity {
  constructor(config) {
    if (!config || typeof config !== 'object' || Array.isArray(config)) throw new Error('sanity must be false or a configuration object');
    const { min = -50, max = 50, neutral = 0, initial = neutral, rules } = config;
    if (![min, max, neutral, initial].every(Number.isFinite) ||
        !(min < neutral && neutral < max) || !Number.isFinite(max - min) || initial < min || initial > max) {
      throw new Error('Sanity requires finite min < neutral < max and initial within bounds');
    }
    if (rules !== undefined && rules !== false && (!rules || typeof rules !== 'object' || Array.isArray(rules))) {
      throw new Error('Sanity rules must be false or a rules object');
    }
    Object.assign(this, { min, max, neutral, value: initial, round: 0, panicUntil: null });
    this.rules = createSanityRules(rules === false
      ? { castRateModifier: () => 0, recoveryAmount: () => 0, panicEnabled: false } : rules);
    if (initial === min && this.rules.panicEnabled) this.panicUntil = 1;
    this.state = this.getState();
    this.initialPanicPending = this.isPanicked();
    this.lastSettledRound = -1;
    this.events = [];
    this.dispatching = false;
  }

  isPanicked() { return this.panicUntil !== null; }

  getState() {
    if (this.isPanicked()) return 'PANIC';
    const state = this.rules.getState(this);
    if (typeof state !== 'string' || !state || state === 'PANIC') throw new Error('Sanity getState must return a nonempty state other than PANIC');
    return state;
  }

  castRateModifier(entity) {
    const modifier = this.rules.castRateModifier(this, entity);
    if (!Number.isFinite(modifier)) throw new Error('Sanity castRateModifier must return a finite number');
    return modifier;
  }

  // Initialization is announced once, after BATTLE_START (or before a direct turn).
  announce(entity, logger, engine, round = 0) {
    this.round = round;
    if (!this.initialPanicPending || !entity.isAlive) return;
    this.initialPanicPending = false;
    this.panicUntil = round + 1;
    this.publish(entity, this.value, null, logger, { engine, source: 'INITIAL' });
  }

  change(entity, delta, logger, context = {}) {
    if (!Number.isFinite(delta)) throw new Error('Sanity delta must be finite');
    if (!entity.isAlive) return 0;
    if (this.initialPanicPending) this.announce(entity, logger, context.engine);
    const before = this.value;
    const after = Math.max(this.min, Math.min(this.max, before + delta));
    if (after === before) return 0;
    const previousState = this.state;
    this.value = after;
    if (after === this.min && this.rules.panicEnabled && !this.isPanicked()) {
      this.panicUntil = (context.engine?.currentTurn ?? this.round) + 1;
    }
    this.state = this.getState();
    this.publish(entity, before, previousState, logger, context);
    return after - before;
  }

  publish(entity, before, previousState, logger, context) {
    const event = Object.freeze({ before, after: this.value, value: this.value - before,
      previousState, state: this.state, source: context.source || 'DIRECT',
      actorId: context.caster?.id ?? entity.id, targetId: entity.id,
      skillId: context.skill?.id, skillTier: context.skill?.tier,
      isNormalAttack: context.skill ? context.skill === context.caster?.normalAttack : undefined,
      panicUntil: this.panicUntil });
    // Queue reactions so nested changes cannot interleave the two events of this change.
    this.events.push({ event, context, logger });
    if (this.dispatching) return;
    this.dispatching = true;
    let count = 0;
    try {
      while (this.events.length) {
        if (++count > 100) throw new Error('Sanity reaction cycle exceeded 100 changes');
        const { event: e, context: ctx, logger: out } = this.events.shift();
        if (e.value !== 0) out?.addLog({ ...e, type: 'SANITY_CHANGE',
          message: ctx.message ? ctx.message(e) : `${entity.name} 的理智 ${e.before} → ${e.after}。` });
        if (e.previousState !== e.state) {
          const type = e.state === 'PANIC' ? 'SANITY_PANIC'
            : e.previousState === 'PANIC' ? 'SANITY_RECOVER' : 'SANITY_STATE_CHANGE';
          const label = { SHAKEN: '動搖', INSPIRED: '振奮', NEUTRAL: '平穩' }[e.state] || e.state;
          out?.addLog({ ...e, type, message: e.state === 'PANIC' ? `${entity.name} 精神崩潰，暫時無法行動！`
            : e.previousState === 'PANIC' ? `${entity.name} 從崩潰中恢復。` : `${entity.name} 的精神狀態轉為${label}。` });
        }
        const reaction = { ...e, target: entity, caster: ctx.caster, skill: ctx.skill };
        for (const trigger of ['ON_SANITY_CHANGE', 'ON_SANITY_STATE_CHANGE']) {
          if (trigger === 'ON_SANITY_CHANGE' ? e.value === 0 : e.previousState === e.state) continue;
          for (const passive of [...entity.passives]) {
            if (!entity.isAlive || ctx.engine?.result) break;
            if (passive.trigger === trigger && (!passive.enabled || passive.enabled(entity, reaction))) {
              passive.action?.(entity, reaction, out, ctx.engine);
            }
          }
        }
      }
    } finally {
      this.dispatching = false;
      this.events.length = 0;
    }
  }

  endRound(entity, logger, engine) {
    if (!entity.isAlive || engine.result || this.lastSettledRound === engine.currentTurn) return;
    this.lastSettledRound = engine.currentTurn;
    if (this.isPanicked()) {
      if (engine.currentTurn < this.panicUntil) return;
      const before = this.value;
      const previousState = this.state;
      this.panicUntil = null;
      this.value = Math.max(this.neutral, this.value);
      this.state = this.getState();
      this.publish(entity, before, previousState, logger, { engine, source: 'PANIC_RECOVERY' });
      return;
    }
    const amount = this.rules.recoveryAmount(this, entity);
    if (!Number.isFinite(amount) || amount < 0) throw new Error('Sanity recoveryAmount must return a finite nonnegative number');
    const delta = Math.sign(this.neutral - this.value) * Math.min(amount, Math.abs(this.neutral - this.value));
    this.change(entity, delta, logger, { engine, source: 'ROUND_RECOVERY' });
  }
}

module.exports = { Sanity, createSanityRules };

},
"src/core/Skill.js": function (module, exports, require) {
const Formulas = require('../utils/Formulas');

/**
 * 戰報文字。
 *
 * 所有訊息回呼——不論是片段（action.text.*）還是整句覆寫（action.message）——
 * 都只收「一個 context 物件」，四種 action type 的簽章完全一致：
 *
 *   {

const DefaultText = {
  DAMAGE: {
    action: (ctx) => `${ctx.caster.name} 攻擊，`,
    combo: (ctx) => `第 ${ctx.hitIndex} 擊，`,
